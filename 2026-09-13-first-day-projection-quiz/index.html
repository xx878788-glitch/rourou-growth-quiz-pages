<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7efe3">
  <title>柔柔｜妳的潛意識正在提醒什麼</title>
  <meta name="description" content="從第一眼看見的畫面，讀懂妳面對開始與成長時的內在狀態">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23f2d9cb'/%3E%3Cpath d='M17 43c9-2 14-9 15-22 2 11 7 18 16 22-8-1-13 2-16 9-3-7-8-10-15-9Z' fill='%237f554a'/%3E%3C/svg%3E">
  <style>
    :root {
      --ink: #3e302c;
      --muted: #796964;
      --paper: #fffaf2;
      --cream: #f7efe3;
      --peach: #e9bca7;
      --peach-soft: #f7dfd3;
      --blue: #9eb2c7;
      --blue-soft: #e7edf2;
      --gold: #c99b52;
      --sage: #aeb7a2;
      --line: rgba(89, 67, 58, .15);
      --shadow: 0 22px 64px rgba(79, 57, 47, .12);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 14% 10%, rgba(242, 205, 188, .5), transparent 29rem),
        radial-gradient(circle at 88% 32%, rgba(188, 202, 214, .45), transparent 31rem),
        var(--cream);
      font-family: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
      line-height: 1.8;
    }

    button { font: inherit; }
    .shell { width: min(1080px, calc(100% - 28px)); margin: 24px auto 54px; }

    .paper {
      position: relative;
      overflow: hidden;
      padding: clamp(24px, 5vw, 58px);
      border: 1px solid var(--line);
      border-radius: 32px;
      background:
        linear-gradient(rgba(255, 250, 242, .94), rgba(255, 250, 242, .94)),
        repeating-linear-gradient(35deg, rgba(113, 85, 67, .06) 0 1px, transparent 1px 6px);
      box-shadow: var(--shadow);
    }

    .paper::before {
      content: "";
      position: absolute;
      inset: 0 0 auto;
      height: 6px;
      background: linear-gradient(90deg, var(--blue), var(--peach), #e9ca83);
    }

    .intro { max-width: 720px; margin: 0 auto 26px; text-align: center; }
    .eyebrow {
      display: inline-block;
      margin-bottom: 12px;
      padding: 5px 14px;
      border-radius: 999px;
      color: #795148;
      background: var(--peach-soft);
      font-size: .9rem;
      letter-spacing: .08em;
    }
    h1 { margin: 0; font-size: clamp(2rem, 6vw, 4rem); line-height: 1.28; letter-spacing: -.035em; }
    .intro p { margin: 14px auto 0; color: var(--muted); font-size: 1.03rem; }
    .intro-copy-line { display: block; }
    .intro-copy-line + .intro-copy-line { margin-top: 2px; }

    .quiz-stage {
      display: grid;
      grid-template-columns: minmax(280px, 480px) minmax(310px, 1fr);
      gap: clamp(24px, 5vw, 52px);
      align-items: center;
      max-width: 930px;
      margin: 0 auto;
    }

    .quiz-art {
      margin: 0;
      overflow: hidden;
      border: 1px solid rgba(93, 69, 59, .16);
      border-radius: 24px;
      background: #fdf8ef;
      box-shadow: 0 14px 34px rgba(74, 55, 47, .11);
    }
    .quiz-art img { display: block; width: 100%; height: auto; }

    .pick-panel { min-width: 0; }
    .pick-panel h2 { margin: 0 0 8px; font-size: clamp(1.5rem, 3vw, 2.25rem); line-height: 1.45; }
    .pick-panel > p { margin: 0 0 18px; color: var(--muted); }

    .choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .choice {
      display: grid;
      grid-template-columns: 38px 1fr;
      align-items: center;
      gap: 10px;
      min-height: 64px;
      padding: 10px 13px;
      border: 1px solid var(--line);
      border-radius: 17px;
      color: var(--ink);
      background: rgba(255, 255, 255, .72);
      cursor: pointer;
      text-align: left;
      transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
    }
    .choice:hover { transform: translateY(-2px); border-color: rgba(170, 110, 87, .45); box-shadow: 0 9px 22px rgba(79, 57, 47, .09); }
    .choice:focus-visible { outline: 4px solid rgba(225, 166, 142, .3); outline-offset: 2px; }
    .choice[aria-pressed="true"] { border-color: #b77d68; background: #fff4ed; box-shadow: 0 0 0 3px rgba(213, 151, 126, .14); }
    .letter {
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      color: white;
      background: #72574e;
      font-family: system-ui, sans-serif;
      font-weight: 750;
    }
    .choice strong { font-size: 1rem; font-weight: 700; }

    .note { margin: 18px 0 0; padding-left: 16px; border-left: 3px solid var(--peach); color: var(--muted); font-size: .92rem; }

    .result {
      max-width: 840px;
      margin: 44px auto 0;
      padding: clamp(24px, 5vw, 46px);
      border: 1px solid var(--line);
      border-radius: 28px;
      background: rgba(255, 255, 255, .76);
      box-shadow: 0 16px 46px rgba(70, 50, 42, .09);
    }
    .result[hidden] { display: none; }
    .result-head { display: flex; align-items: flex-start; gap: 16px; }
    .result-symbol {
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      width: 54px;
      height: 54px;
      border-radius: 18px;
      background: var(--peach-soft);
      font-size: 1.6rem;
    }
    .result-kicker { margin: 0; color: #a06956; font-size: .9rem; font-weight: 700; letter-spacing: .08em; }
    .result h2 { margin: 3px 0 0; font-size: clamp(1.7rem, 4vw, 2.7rem); line-height: 1.35; }
    .lead { margin: 22px 0 0; color: #554744; font-size: 1.05rem; }
    .lead p { margin: 0; }
    .lead p + p { margin-top: 14px; }

    .result-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-top: 25px; }
    .insight {
      padding: 18px;
      border-radius: 19px;
      background: #faf4eb;
      border: 1px solid rgba(102, 76, 65, .1);
    }
    .insight:nth-child(2) { background: var(--blue-soft); }
    .insight h3 { margin: 0 0 7px; font-size: 1.05rem; }
    .insight p { margin: 0; color: #655854; font-size: .96rem; }

    .practice { margin-top: 26px; }
    .practice h3 { margin: 0 0 12px; font-size: 1.22rem; }
    .steps { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; counter-reset: steps; }
    .steps li {
      counter-increment: steps;
      display: grid;
      grid-template-columns: 34px 1fr;
      gap: 11px;
      align-items: start;
      padding: 12px 14px;
      border-radius: 15px;
      background: rgba(245, 226, 213, .55);
    }
    .steps li::before {
      content: counter(steps);
      display: grid;
      place-items: center;
      width: 29px;
      height: 29px;
      border-radius: 50%;
      color: white;
      background: #9c7161;
      font-family: system-ui, sans-serif;
      font-size: .88rem;
      font-weight: 700;
    }

    .letter-note { margin: 26px 0 0; padding: 21px; border-radius: 18px; background: #fff7ed; border: 1px dashed rgba(171, 116, 91, .35); }
    .letter-note strong { display: block; margin-bottom: 5px; color: #9b6653; }
    .letter-note p { margin: 0; }

    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; }
    .action {
      min-height: 46px;
      padding: 9px 17px;
      border: 1px solid rgba(92, 67, 58, .18);
      border-radius: 999px;
      color: var(--ink);
      background: white;
      cursor: pointer;
    }
    .action.primary { color: white; background: #73564c; border-color: #73564c; }
    .action:focus-visible { outline: 4px solid rgba(225, 166, 142, .3); outline-offset: 2px; }

    .disclaimer { max-width: 720px; margin: 26px auto 0; color: #867873; text-align: center; font-size: .82rem; }
    footer { margin-top: 28px; color: #8a7770; text-align: center; font-size: .88rem; }

    @media (max-width: 760px) {
      .shell { width: min(100% - 18px, 620px); margin-top: 10px; }
      .paper { padding: 24px 15px 30px; border-radius: 22px; }
      .intro { margin-bottom: 20px; }
      .intro p { font-size: .96rem; }
      .quiz-stage { grid-template-columns: 1fr; gap: 20px; }
      .quiz-art { width: min(100%, 470px); margin: 0 auto; border-radius: 18px; }
      .pick-panel { text-align: center; }
      .pick-panel > p { margin-bottom: 13px; }
      .choices { gap: 9px; }
      .choice { min-height: 56px; padding: 8px 10px; grid-template-columns: 32px 1fr; text-align: left; }
      .letter { width: 31px; height: 31px; }
      .note { text-align: left; }
      .result { margin-top: 30px; padding: 23px 17px; border-radius: 22px; }
      .result-head { gap: 12px; }
      .result-symbol { width: 46px; height: 46px; border-radius: 15px; }
      .result-grid { grid-template-columns: 1fr; }
      .actions { display: grid; grid-template-columns: 1fr 1fr; }
    }

    @media (max-width: 390px) {
      .choices { grid-template-columns: 1fr; }
      .choice { min-height: 52px; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .choice { transition: none; }
    }
  </style>
</head>

    const resultEl = document.querySelector("#result");
    const choices = [...document.querySelectorAll(".choice")];

    function renderResult(key, shouldScroll = true) {
      const data = results[key];
      if (!data) return;
      choices.forEach((button) => button.setAttribute("aria-pressed", String(button.dataset.choice === key)));
      document.querySelector("#result-symbol").textContent = data.symbol;
      document.querySelector("#result-kicker").textContent = data.kicker;
      document.querySelector("#result-title").textContent = data.title;
      document.querySelector("#result-lead").innerHTML = data.lead.map((text) => `<p>${text}</p>`).join("");
      document.querySelector("#result-strength").textContent = data.strength;
      document.querySelector("#result-block").textContent = data.block;
      document.querySelector("#result-steps").innerHTML = data.steps.map((step) => `<li><span>${step}</span></li>`).join("");
      document.querySelector("#result-note").textContent = data.note;
      resultEl.hidden = false;
      history.replaceState(null, "", `#${key}`);
      if (shouldScroll) resultEl.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    choices.forEach((button) => button.addEventListener("click", () => renderResult(button.dataset.choice)));

    document.querySelector("#reset").addEventListener("click", () => {
      choices.forEach((button) => button.setAttribute("aria-pressed", "false"));
      resultEl.hidden = true;
      history.replaceState(null, "", location.pathname + location.search);
      document.querySelector("#pick-title").scrollIntoView({ behavior: "smooth", block: "center" });
    });

    document.querySelector("#share").addEventListener("click", async () => {
      const selected = choices.find((button) => button.getAttribute("aria-pressed") === "true");
      if (!selected) return;
      const data = results[selected.dataset.choice];
      const shareData = { title: "柔柔｜潛意識投射測驗", text: `我的結果是：${data.title}`, url: location.href };
      try {
        if (navigator.share) await navigator.share(shareData);
        else {
          await navigator.clipboard.writeText(`${shareData.text}\n${shareData.url}`);
          document.querySelector("#share").textContent = "結果連結已複製";
          setTimeout(() => { document.querySelector("#share").textContent = "分享這個結果"; }, 1800);
        }
      } catch (error) {
        if (error && error.name !== "AbortError") alert("目前無法分享，請截圖保存結果");
      }
    });

    const initial = location.hash.replace("#", "").toUpperCase();
    if (results[initial]) renderResult(initial, false);
  </script>
