<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f0e4">
  <title>柔柔｜你在感情裡最渴望哪一種在乎？</title>
  <meta name="description" content="溫飲、小卡、雨傘、車票，憑直覺選一樣最想收到的東西，看看哪些小事最能讓你感到被愛">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23f6dfc0'/%3E%3Cpath d='M32 50C18 40 13 32 13 25c0-6 5-10 10-10 4 0 7 2 9 6 2-4 5-6 9-6 5 0 10 4 10 10 0 7-5 15-19 25Z' fill='%237f5a42'/%3E%3C/svg%3E">
  <style>
    :root {
      --ink: #3e302a;
      --muted: #786760;
      --paper: #fffaf1;
      --cream: #f8efdf;
      --peach: #e8b996;
      --peach-soft: #f8e1cc;
      --sage: #a8b9d8;
      --sage-soft: #ebf0f7;
      --gold: #e3bf74;
      --line: rgba(92, 68, 52, .15);
      --shadow: 0 22px 64px rgba(84, 60, 40, .12);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 14% 8%, rgba(246, 211, 168, .55), transparent 29rem),
        radial-gradient(circle at 88% 34%, rgba(178, 196, 226, .45), transparent 31rem),
        var(--cream);
      font-family: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
      line-height: 1.8;
    }

    button { font: inherit; }
    .shell { width: min(1080px, calc(100% - 28px)); margin: 24px auto 54px; }

    .paper {
      position: relative;
      overflow: hidden;
      padding: clamp(24px, 5vw, 58px);
      border: 1px solid var(--line);
      border-radius: 32px;
      background:
        linear-gradient(rgba(255, 250, 241, .94), rgba(255, 250, 241, .94)),
        repeating-linear-gradient(35deg, rgba(113, 85, 60, .06) 0 1px, transparent 1px 6px);
      box-shadow: var(--shadow);
    }

    .paper::before {
      content: "";
      position: absolute;
      inset: 0 0 auto;
      height: 6px;
      background: linear-gradient(90deg, var(--sage), var(--peach), var(--gold));
    }

    .intro { max-width: 720px; margin: 0 auto 26px; text-align: center; }
    .eyebrow {
      display: inline-block;
      margin-bottom: 12px;
      padding: 5px 14px;
      border-radius: 999px;
      color: #7b5440;
      background: var(--peach-soft);
      font-size: .9rem;
      letter-spacing: .08em;
    }
    h1 { margin: 0; font-size: clamp(2rem, 6vw, 4rem); line-height: 1.28; letter-spacing: -.035em; }
    .intro p { margin: 14px auto 0; color: var(--muted); font-size: 1.03rem; }
    .intro-copy-line { display: block; }
    .intro-copy-line + .intro-copy-line { margin-top: 2px; }
    .intro-copy-line.strong { color: #8a5a3f; font-weight: 700; font-size: 1.12rem; }

    .quiz-stage {
      display: grid;
      grid-template-columns: minmax(280px, 460px) minmax(310px, 1fr);
      gap: clamp(24px, 5vw, 52px);
      align-items: center;
      max-width: 930px;
      margin: 0 auto;
    }

    .quiz-art {
      margin: 0;
      overflow: hidden;
      border: 1px solid rgba(93, 69, 52, .16);
      border-radius: 24px;
      background: #fdf6ea;
      box-shadow: 0 14px 34px rgba(74, 55, 40, .11);
    }
    .quiz-art img { display: block; width: 100%; height: auto; }

    .pick-panel { min-width: 0; }
    .pick-panel h2 { margin: 0 0 8px; font-size: clamp(1.5rem, 3vw, 2.25rem); line-height: 1.45; }
    .pick-panel > p { margin: 0 0 18px; color: var(--muted); }

    .choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .choice {
      display: grid;
      grid-template-columns: 38px 1fr;
      align-items: center;
      gap: 10px;
      min-height: 64px;
      padding: 10px 13px;
      border: 1px solid var(--line);
      border-radius: 17px;
      color: var(--ink);
      background: rgba(255, 255, 255, .72);
      cursor: pointer;
      text-align: left;
      transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
    }
    .choice:hover { transform: translateY(-2px); border-color: rgba(176, 116, 80, .45); box-shadow: 0 9px 22px rgba(79, 57, 40, .09); }
    .choice:focus-visible { outline: 4px solid rgba(232, 185, 150, .35); outline-offset: 2px; }
    .choice[aria-pressed="true"] { border-color: #b8835f; background: #fff3e6; box-shadow: 0 0 0 3px rgba(214, 160, 118, .16); }
    .letter {
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      color: white;
      background: #7a5a46;
      font-family: system-ui, sans-serif;
      font-weight: 750;
    }
    .choice strong { font-size: 1.05rem; font-weight: 700; }

    .note { margin: 18px 0 0; padding-left: 16px; border-left: 3px solid var(--peach); color: var(--muted); font-size: .92rem; }

    .result {
      max-width: 840px;
      margin: 44px auto 0;
      padding: clamp(24px, 5vw, 46px);
      border: 1px solid var(--line);
      border-radius: 28px;
      background: rgba(255, 255, 255, .76);
      box-shadow: 0 16px 46px rgba(70, 50, 36, .09);
      scroll-margin-top: 16px;
    }
    .result[hidden] { display: none; }
    .result-head { display: flex; align-items: flex-start; gap: 16px; }
    .result-symbol {
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      width: 54px;
      height: 54px;
      border-radius: 18px;
      color: #7b5440;
      background: var(--peach-soft);
      font-size: 1.6rem;
    }
    .result-kicker { margin: 0; color: #a46a4a; font-size: .9rem; font-weight: 700; letter-spacing: .08em; }
    .result h2 { margin: 3px 0 0; font-size: clamp(1.6rem, 4vw, 2.5rem); line-height: 1.4; }
    .lead { margin: 22px 0 0; color: #554740; font-size: 1.05rem; }
    .lead p { margin: 0; }
    .lead p + p { margin-top: 14px; }

    .result-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-top: 25px; }
    .insight {
      padding: 18px;
      border-radius: 19px;
      background: #faf3e8;
      border: 1px solid rgba(102, 76, 58, .1);
    }
    .insight:nth-child(2) { background: var(--sage-soft); }
    .insight h3 { margin: 0 0 7px; font-size: 1.05rem; }
    .insight p { margin: 0; color: #655750; font-size: .96rem; }

    .practice { margin-top: 26px; }
    .practice h3 { margin: 0 0 12px; font-size: 1.22rem; }
    .steps { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; counter-reset: steps; }
    .steps li {
      counter-increment: steps;
      display: grid;
      grid-template-columns: 34px 1fr;
      gap: 11px;
      align-items: start;
      padding: 12px 14px;
      border-radius: 15px;
      background: rgba(246, 226, 204, .55);
    }
    .steps li::before {
      content: counter(steps);
      display: grid;
      place-items: center;
      width: 29px;
      height: 29px;
      border-radius: 50%;
      color: white;
      background: #a3735a;
      font-family: system-ui, sans-serif;
      font-size: .88rem;
      font-weight: 700;
    }

    .letter-note { margin: 26px 0 0; padding: 21px; border-radius: 18px; background: #fff6e8; border: 1px dashed rgba(176, 120, 84, .35); }
    .letter-note strong { display: block; margin-bottom: 5px; color: #9c6748; }
    .letter-note p { margin: 0; }

    .others { margin-top: 26px; padding-top: 20px; border-top: 1px solid var(--line); }
    .others h3 { margin: 0 0 10px; font-size: 1rem; color: var(--muted); font-weight: 700; }
    .others-list { display: flex; flex-wrap: wrap; gap: 8px; }
    .other {
      padding: 7px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--ink);
      background: #fffaf3;
      cursor: pointer;
      font-size: .92rem;
    }
    .other:hover { border-color: rgba(176, 116, 80, .45); }
    .other:focus-visible { outline: 4px solid rgba(232, 185, 150, .35); outline-offset: 2px; }

    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; }
    .action {
      min-height: 46px;
      padding: 9px 17px;
      border: 1px solid rgba(92, 67, 52, .18);
      border-radius: 999px;
      color: var(--ink);
      background: white;
      cursor: pointer;
    }
    .action.primary { color: white; background: #7a5a46; border-color: #7a5a46; }
    .action:focus-visible { outline: 4px solid rgba(232, 185, 150, .35); outline-offset: 2px; }

    .disclaimer { max-width: 720px; margin: 26px auto 0; color: #877870; text-align: center; font-size: .82rem; }
    footer { margin-top: 28px; color: #8a776c; text-align: center; font-size: .88rem; }

    @media (max-width: 760px) {
      .shell { width: min(100% - 18px, 620px); margin-top: 10px; }
      .paper { padding: 24px 15px 30px; border-radius: 22px; }
      .intro { margin-bottom: 20px; }
      .intro p { font-size: .96rem; }
      .quiz-stage { grid-template-columns: 1fr; gap: 20px; }
      .quiz-art { width: min(100%, 440px); margin: 0 auto; border-radius: 18px; }
      .pick-panel { text-align: center; }
      .pick-panel > p { margin-bottom: 13px; }
      .choices { gap: 9px; }
      .choice { min-height: 56px; padding: 8px 10px; grid-template-columns: 32px 1fr; text-align: left; }
      .letter { width: 31px; height: 31px; }
      .note { text-align: left; }
      .result { margin-top: 30px; padding: 23px 17px; border-radius: 22px; }
      .result-head { gap: 12px; }
      .result-symbol { width: 46px; height: 46px; border-radius: 15px; }
      .result-grid { grid-template-columns: 1fr; }
      .actions { display: grid; grid-template-columns: 1fr 1fr; }
    }

    @media (max-width: 390px) {
      .choices { grid-template-columns: 1fr; }
      .choice { min-height: 52px; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .choice { transition: none; }
    }
  </style>
</head>

          "你不是需要很多甜言蜜語，而是想確定：我在你心裡，真的有位置。當對方總是用做的、很少用說的，你會開始猜，猜他是不是沒那麼在意。你最渴望的，是在乎能被清楚地說出來，讓你不用再自己猜。"
        ],
        strength: "你很懂得表達心意，也很會在對的時候說出讓人安心的話。你的一句鼓勵，常常能讓身邊的人撐過難熬的日子。",
        block: "對方沉默的時候，你容易往壞的方向想，把沒說出口的話解讀成不在乎，然後一個人在心裡反覆確認、越想越不安。",
        steps: [
          "直接告訴對方：偶爾聽你說喜歡我、謝謝我，會讓我很安心",
          "把收到過的好話記下來，不安的時候拿出來看一看",
          "今天先寫一張小卡給自己，寫下一件你欣賞自己的地方"
        ],
        note: "想聽到在乎，從來不是太貪心。你值得被清楚地告訴：你很重要。"
      },
      C: {
        label: "雨傘",
        symbol: "☂",
        kicker: "你最想收到｜雨傘",
        title: "你最渴望的，是需要時有人在的安心",
        lead: [
          "你選了一把雨傘，代表你心裡最在意的，是「需要的時候，有沒有人在」。比起浪漫的驚喜，你更在乎下雨時有人記得帶傘、難過時有人願意出現，讓你不用一個人淋濕。",
          "你可能很獨立，很多事都習慣自己扛，也不太喜歡麻煩別人。但正因為一直很堅強，你心裡更渴望有一個可以靠的地方。你最渴望的，是一份穩穩的守護：不一定天天黏在一起，但你知道，只要你開口，他就會在。"
        ],
        strength: "你可靠、負責，也很懂得守護重要的人。在別人慌亂的時候，你常常是最冷靜、最讓人安心的那一個。",
        block: "你太習慣自己撐，連累了、怕了都不太讓對方知道。等到真的撐不住，才發現身邊的人根本不知道你需要幫忙。",
        steps: [
          "下一次遇到難事，試著在自己扛以前，先跟對方說一聲",
          "記下對方曾經在你需要時出現的時刻，讓自己相信可以被依靠",
          "告訴對方：比起禮物，你需要的時候在，對我最重要"
        ],
        note: "你不用一直當那個撐傘的人。偶爾讓別人為你撐一次，也是一種被愛。"
      },
      D: {
        label: "車票",
        symbol: "⇢",
        kicker: "你最想收到｜車票",
        title: "你最渴望的，是一起走下去的陪伴",
        lead: [
          "你選了兩張車票，代表你在感情裡最珍惜的，是「一起」。一起出發、一起看風景、一起經歷新的事情。對你來說，願意把時間留給你、和你一起創造回憶，就是最真的在乎。",
          "你重視共同的時光，也期待兩個人能朝同一個方向走。當對方總是很忙、很少主動安排相處，你會覺得自己好像一直在等。你最渴望的，不是昂貴的禮物，而是有人說：我們一起去吧，然後真的空出時間陪你。"
        ],
        strength: "你很會替關係製造美好的回憶，也願意花心思安排兩個人的時間。和你在一起，日子總是多了一點期待。",
        block: "你容易把對方的忙碌，當成自己不夠重要；明明想要陪伴，卻又怕說出來讓對方有壓力，只好自己安排、自己等待。",
        steps: [
          "主動約定一段兩個人專屬的時間，就算只是一起散步半小時",
          "告訴對方：比起送我東西，我更想跟你一起做一件事",
          "也替自己安排一趟小旅行，享受一個人出發的自在"
        ],
        note: "最好的陪伴，是兩個人都願意把時間留給彼此。你值得一個想和你一起出發的人。"
      }
    };

    const resultEl = document.querySelector("#result");
    const choices = [...document.querySelectorAll(".choice")];

    function renderResult(key, scroll = "smooth") {
      const data = results[key];
      if (!data) return;
      choices.forEach((button) => button.setAttribute("aria-pressed", String(button.dataset.choice === key)));
      document.querySelector("#result-symbol").textContent = data.symbol;
      document.querySelector("#result-kicker").textContent = data.kicker;
      document.querySelector("#result-title").textContent = data.title;
      document.querySelector("#result-lead").replaceChildren(...data.lead.map((text) => {
        const p = document.createElement("p");
        p.textContent = text;
        return p;
      }));
      document.querySelector("#result-strength").textContent = data.strength;
      document.querySelector("#result-block").textContent = data.block;
      document.querySelector("#result-steps").replaceChildren(...data.steps.map((step) => {
        const li = document.createElement("li");
        const span = document.createElement("span");
        span.textContent = step;
        li.append(span);
        return li;
      }));
      document.querySelector("#result-note").textContent = data.note;
      document.querySelector("#others-list").replaceChildren(...Object.keys(results).filter((k) => k !== key).map((k) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "other";
        button.textContent = `${k}｜${results[k].label}`;
        button.addEventListener("click", () => renderResult(k));
        return button;
      }));
      resultEl.hidden = false;
      history.replaceState(null, "", `#${key}`);
      if (scroll) resultEl.scrollIntoView({ behavior: scroll, block: "start" });
    }

    choices.forEach((button) => button.addEventListener("click", () => renderResult(button.dataset.choice)));

    document.querySelector("#reset").addEventListener("click", () => {
      choices.forEach((button) => button.setAttribute("aria-pressed", "false"));
      resultEl.hidden = true;
      history.replaceState(null, "", location.pathname + location.search);
      document.querySelector("#pick-title").scrollIntoView({ behavior: "smooth", block: "center" });
    });

    document.querySelector("#share").addEventListener("click", async () => {
      const selected = choices.find((button) => button.getAttribute("aria-pressed") === "true");
      if (!selected) return;
      const data = results[selected.dataset.choice];
      const shareData = { title: "柔柔｜感情在乎測驗", text: `我的結果是：${data.title}`, url: location.href };
      try {
        if (navigator.share) await navigator.share(shareData);
        else {
          await navigator.clipboard.writeText(`${shareData.text}\n${shareData.url}`);
          document.querySelector("#share").textContent = "結果連結已複製";
          setTimeout(() => { document.querySelector("#share").textContent = "分享這個結果"; }, 1800);
        }
      } catch (error) {
        if (error && error.name !== "AbortError") alert("目前無法分享，請截圖保存結果");
      }
    });

    // 從 IG 私訊點進來時，網址帶 #A ~ #D 會直接打開該結果
    const initial = location.hash.replace("#", "").toUpperCase();
    if (results[initial]) renderResult(initial, "auto");
  </script>
</body>
</html>
