<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f2e8">
  <title>柔柔｜妳是這個家的哪一塊</title>
  <meta name="description" content="憑第一眼直覺選一個，看看妳在家裡站的是哪個位置">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23f6dcae'/%3E%3Cpath d='M12 30 32 14l20 16v18a2 2 0 0 1-2 2H14a2 2 0 0 1-2-2Z' fill='%23fff9ef'/%3E%3Cpath d='M28 50V36h8v14' fill='none' stroke='%23725a4b' stroke-width='3' stroke-linejoin='round'/%3E%3C/svg%3E">
  <style>
    :root {
      --ink: #332c27;
      --muted: #776b62;
      --paper: #fffdf8;
      --cream: #f8f2e8;
      --honey: #f4cf79;
      --honey-soft: #fff1c8;
      --rose: #dba69a;
      --rose-soft: #f9e7e1;
      --blue-soft: #e9f0f2;
      --sage-soft: #eaf0e6;
      --accent: #7d947f;
      --accent-dark: #687e6a;
      --accent-soft: #e5eee5;
      --line: rgba(76, 62, 52, .14);
      --shadow: 0 24px 70px rgba(73, 56, 43, .12);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 8% 9%, rgba(244, 207, 121, .35), transparent 27rem),
        radial-gradient(circle at 92% 30%, rgba(219, 166, 154, .28), transparent 30rem),
        var(--cream);
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
      line-height: 1.75;
    }

    button, a { font: inherit; }
    button { color: inherit; }
    .shell { width: min(1080px, calc(100% - 28px)); margin: 24px auto 54px; }

    .paper {
      position: relative;
      overflow: hidden;
      padding: clamp(24px, 5vw, 58px);
      border: 1px solid var(--line);
      border-radius: 34px;
      background:
        linear-gradient(rgba(255, 253, 248, .96), rgba(255, 253, 248, .96)),
        repeating-linear-gradient(33deg, rgba(110, 87, 68, .045) 0 1px, transparent 1px 7px);
      box-shadow: var(--shadow);
    }

    .paper::before {
      content: "";
      position: absolute;
      inset: 0 0 auto;
      height: 7px;
      background: linear-gradient(90deg, var(--honey), var(--rose), #b9c9c5);
    }

    .decor {
      position: absolute;
      z-index: 0;
      color: var(--accent);
      opacity: .3;
      pointer-events: none;
      user-select: none;
    }
    .decor-one { top: 25px; left: clamp(18px, 4vw, 48px); font-size: 1.5rem; transform: rotate(-12deg); }
    .decor-two { top: 74px; right: clamp(18px, 4vw, 54px); font-size: 1.25rem; transform: rotate(13deg); }
    .paper > *:not(.decor) { position: relative; z-index: 1; }

    .intro { max-width: 760px; margin: 0 auto 30px; text-align: center; }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 13px;
      padding: 6px 15px;
      border-radius: 999px;
      color: #755c42;
      background: var(--honey-soft);
      font-size: .9rem;
      font-weight: 700;
      letter-spacing: .08em;
    }
    .eyebrow::before { content: "✦"; font-size: .75rem; }
    h1 { margin: 0; font-size: clamp(2.15rem, 6vw, 4.2rem); line-height: 1.23; letter-spacing: -.045em; }
    .intro p { margin: 15px auto 0; color: var(--muted); font-size: 1.03rem; }

    .quiz-stage {
      display: grid;
      grid-template-columns: minmax(300px, 1.08fr) minmax(300px, .92fr);
      gap: clamp(25px, 5vw, 52px);
      align-items: center;
      max-width: 940px;
      margin: 0 auto;
    }

    .quiz-art {
      margin: 0;
      overflow: hidden;
      border: 1px solid rgba(91, 70, 57, .14);
      border-radius: 25px;
      background: #fdf8ee;
      box-shadow: 0 16px 38px rgba(72, 54, 42, .12);
    }
    .quiz-art img { display: block; width: 100%; height: auto; }

    .pick-panel { min-width: 0; }
    .pick-panel h2 { margin: 0 0 7px; font-size: clamp(1.55rem, 3vw, 2.25rem); line-height: 1.4; }
    .pick-panel > p { margin: 0 0 18px; color: var(--muted); }
    .choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 11px; }
    .choice {
      display: grid;
      grid-template-columns: 38px 1fr;
      align-items: center;
      gap: 10px;
      min-height: 65px;
      padding: 10px 13px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(255, 255, 255, .78);
      cursor: pointer;
      text-align: left;
      transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease, background .2s ease;
    }
    .choice:hover { transform: translateY(-2px); border-color: rgba(167, 119, 87, .45); box-shadow: 0 10px 24px rgba(79, 57, 47, .09); }
    .choice:focus-visible, .action:focus-visible { outline: 4px solid rgba(125, 148, 127, .28); outline-offset: 2px; }
    .choice[aria-pressed="true"] { border-color: var(--accent); background: #dce9dd; box-shadow: 0 0 0 3px rgba(125, 148, 127, .14); }
    .letter {
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      color: white;
      background: var(--accent);
      font-weight: 800;
    }
    .choice strong { font-size: .98rem; font-weight: 750; line-height: 1.45; }
    .note { margin: 17px 0 0; padding-left: 15px; border-left: 3px solid var(--honey); color: var(--muted); font-size: .92rem; }

    .result {
      max-width: 860px;
      margin: 46px auto 0;
      padding: clamp(24px, 5vw, 48px);
      border: 1px solid var(--line);
      border-radius: 29px;
      background: rgba(255, 255, 255, .8);
      box-shadow: 0 17px 48px rgba(70, 50, 42, .09);
    }
    .result[hidden] { display: none; }
    .result-head { display: flex; align-items: flex-start; gap: 16px; }
    .result-symbol {
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      width: 56px;
      height: 56px;
      border-radius: 18px;
      background: var(--honey-soft);
      font-size: 1.65rem;
    }
    .result-kicker { margin: 0; color: #9a7142; font-size: .9rem; font-weight: 800; letter-spacing: .07em; }
    .result h2 { margin: 3px 0 0; font-size: clamp(1.75rem, 4vw, 2.75rem); line-height: 1.35; }
    .lead { margin: 22px 0 0; color: #554a44; font-size: 1.04rem; }
    .lead p { margin: 0; }
    .lead p + p { margin-top: 15px; }

    .result-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-top: 27px; }
    .insight { padding: 19px; border: 1px solid rgba(102, 76, 65, .1); border-radius: 20px; background: var(--rose-soft); }
    .insight:nth-child(2) { background: var(--blue-soft); }
    .insight h3 { margin: 0 0 8px; font-size: 1.06rem; }
    .insight p { margin: 0; color: #625751; font-size: .96rem; }

    .pattern { margin-top: 15px; padding: 20px; border-radius: 20px; background: var(--sage-soft); border: 1px solid rgba(84, 105, 77, .1); }
    .pattern h3 { margin: 0 0 8px; font-size: 1.08rem; }
    .pattern p { margin: 0; color: #5d5a52; }

    .practice { margin-top: 27px; }
    .practice h3 { margin: 0 0 12px; font-size: 1.22rem; }
    .steps { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; counter-reset: steps; }
    .steps li {
      counter-increment: steps;
      display: grid;
      grid-template-columns: 34px 1fr;
      gap: 11px;
      align-items: start;
      padding: 13px 14px;
      border-radius: 16px;
      background: rgba(250, 235, 204, .56);
    }
    .steps li::before {
      content: counter(steps);
      display: grid;
      place-items: center;
      width: 29px;
      height: 29px;
      border-radius: 50%;
      color: white;
      background: var(--accent);
      font-size: .88rem;
      font-weight: 800;
    }

    .closing {
      margin-top: 24px;
      padding: 20px 22px;
      border-radius: 20px;
      border: 1px dashed rgba(122, 96, 72, .28);
      background: rgba(255, 249, 235, .72);
      color: #5a4d44;
      font-size: 1.02rem;
      line-height: 1.85;
    }
    .closing p { margin: 0; }

    .actions { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
    .action { min-height: 44px; padding: 8px 17px; border: 1px solid var(--accent); border-radius: 999px; color: white; background: var(--accent); cursor: pointer; }
    .action:hover { background: var(--accent-dark); border-color: var(--accent-dark); }
    .disclaimer { max-width: 760px; margin: 27px auto 0; color: #877a72; text-align: center; font-size: .82rem; }
    footer { margin-top: 29px; color: #89786e; text-align: center; font-size: .88rem; }

    @media (max-width: 760px) {
      .shell { width: min(100% - 18px, 620px); margin-top: 10px; }
      .paper { padding: 25px 15px 31px; border-radius: 23px; }
      .intro { margin-bottom: 21px; }
      .intro p { font-size: .96rem; }
      .quiz-stage { grid-template-columns: 1fr; gap: 21px; }
      .quiz-art { width: min(100%, 500px); margin: 0 auto; border-radius: 19px; }
      .pick-panel { text-align: center; }
      .pick-panel > p { margin-bottom: 13px; }
      .choices { gap: 9px; }
      .choice { min-height: 57px; padding: 8px 10px; grid-template-columns: 32px 1fr; text-align: left; }
      .letter { width: 31px; height: 31px; }
      .note { text-align: left; }
      .result { margin-top: 31px; padding: 24px 17px; border-radius: 23px; }
      .result-head { gap: 12px; }
      .result-symbol { width: 47px; height: 47px; border-radius: 15px; }
      .result-grid { grid-template-columns: 1fr; }
      .closing { padding: 18px 16px; }
      .actions { display: flex; }
    }

    @media (max-width: 390px) {
      .choice { grid-template-columns: 30px 1fr; }
      .choice strong { font-size: .91rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .choice { transition: none; }
    }
  </style>
</head>

          "定一個妳真的做得到的頻率，比如兩週一通電話、一季回去一次。做到就好，不用為此愧疚",
          "回家之前先想清楚這次妳願意處理什麼、不願意處理什麼。到了現場才決定，很容易被情緒帶走",
          "練習一句話：「我們把事情分開，一人負責一塊」"
        ],
        note: "保持距離不等於不愛。有些家要等妳站得夠遠，妳才有力氣回來。"
      }
    };

    const result = document.querySelector("#result");
    const choices = [...document.querySelectorAll(".choice")];

    function renderResult(key, shouldScroll = true) {
      const data = results[key];
      if (!data) return;
      choices.forEach(button => button.setAttribute("aria-pressed", String(button.dataset.choice === key)));
      document.querySelector("#result-symbol").textContent = data.symbol;
      document.querySelector("#result-kicker").textContent = data.kicker;
      document.querySelector("#result-title").textContent = data.title;
      document.querySelector("#result-lead").innerHTML = data.lead.map(text => `<p>${text}</p>`).join("");
      document.querySelector("#result-now").textContent = data.now;
      document.querySelector("#result-need").textContent = data.need;
      document.querySelector("#result-pattern").textContent = data.pattern;
      document.querySelector("#result-steps").innerHTML = data.steps.map(step => `<li>${step}</li>`).join("");
      document.querySelector("#result-note").textContent = data.note;
      result.hidden = false;
      history.replaceState(null, "", `#${key}`);
      if (shouldScroll) result.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    choices.forEach(button => button.addEventListener("click", () => renderResult(button.dataset.choice)));

    document.querySelector("#reset").addEventListener("click", () => {
      result.hidden = true;
      choices.forEach(button => button.setAttribute("aria-pressed", "false"));
      history.replaceState(null, "", location.pathname + location.search);
      document.querySelector("#pick-title").scrollIntoView({ behavior: "smooth", block: "center" });
    });

    const initial = location.hash.replace("#", "").toUpperCase();
    if (results[initial]) renderResult(initial, false);
  </script>
</body>
</html>
