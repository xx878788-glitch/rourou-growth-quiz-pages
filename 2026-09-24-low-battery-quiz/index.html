<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f2e7d0">
  <title>低電量的你，現在需要怎麼充電？｜柔柔</title>
  <meta name="description" content="憑直覺選一個最想走進去的地方，看看你現在最需要的充電方式。">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23e9d8ba'/%3E%3Cpath d='M19 18h23v28H19z' fill='none' stroke='%236f6f42' stroke-width='5'/%3E%3Cpath d='M42 27h4v10h-4M23 39l8-12v9h8L30 48v-9z' fill='%23cf6739'/%3E%3C/svg%3E">
  <style>
    :root {
      --paper: #f4ead5;
      --paper-light: #fbf5e9;
      --ink: #332d27;
      --muted: #746b60;
      --orange: #c96339;
      --orange-soft: #f1d5b8;
      --olive: #6f7140;
      --olive-soft: #dfe1c5;
      --line: rgba(83, 68, 48, .16);
      --shadow: 0 18px 50px rgba(90, 65, 32, .13);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      font-family: "Noto Serif TC", "PingFang TC", "Microsoft JhengHei", serif;
      background:
        radial-gradient(circle at 8% 2%, rgba(202, 102, 58, .10), transparent 27rem),
        radial-gradient(circle at 92% 30%, rgba(111, 113, 64, .10), transparent 28rem),
        repeating-linear-gradient(115deg, rgba(112, 86, 51, .018) 0 1px, transparent 1px 5px),
        var(--paper);
      min-height: 100vh;
    }
    button { font: inherit; }
    .shell { width: min(100% - 32px, 980px); margin: 0 auto; padding: 28px 0 54px; }
    .brand { display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--olive); font-weight: 700; letter-spacing: .14em; font-size: .92rem; margin-bottom: 22px; }
    .brand::before, .brand::after { content: ""; width: 34px; height: 1px; background: currentColor; opacity: .45; }
    .card { background: rgba(251, 245, 233, .88); border: 1px solid rgba(116, 92, 61, .17); border-radius: 28px; box-shadow: var(--shadow); overflow: hidden; backdrop-filter: blur(8px); }
    .intro { padding: clamp(24px, 5vw, 54px); }
    .hero { display: grid; grid-template-columns: minmax(0, .92fr) minmax(320px, 1.08fr); align-items: center; gap: clamp(28px, 5vw, 58px); }
    .copy { text-align: left; }
    .eyebrow { display: inline-flex; align-items: center; gap: 8px; color: var(--orange); font-weight: 700; letter-spacing: .08em; font-size: .9rem; }
    h1 { margin: 12px 0 14px; font-size: clamp(2.15rem, 6vw, 4.3rem); line-height: 1.18; letter-spacing: -.035em; }
    .lead { margin: 0; color: var(--muted); font-size: 1.06rem; line-height: 1.85; }
    .image-frame { position: relative; padding: 10px; border-radius: 26px; background: #eee0c6; transform: rotate(.5deg); box-shadow: 0 14px 38px rgba(72, 52, 27, .15); }
    .image-frame::after { content: ""; position: absolute; inset: 5px; border: 1px solid rgba(92, 66, 36, .16); border-radius: 21px; pointer-events: none; }
    .image-frame img { display: block; width: 100%; height: auto; border-radius: 18px; }
    .prompt { text-align: center; margin: 42px auto 19px; }
    .prompt h2 { margin: 0 0 8px; font-size: clamp(1.45rem, 4vw, 2rem); }
    .prompt p { margin: 0; color: var(--muted); line-height: 1.7; }
    .choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .choice {
      position: relative; display: flex; gap: 14px; align-items: center; width: 100%; min-height: 88px;
      padding: 16px 18px; border: 1px solid var(--line); border-radius: 18px; color: var(--ink); text-align: left;
      background: rgba(255, 251, 242, .72); cursor: pointer; transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    }
    .choice:hover { transform: translateY(-2px); border-color: rgba(201, 99, 57, .5); box-shadow: 0 10px 24px rgba(98, 68, 35, .10); }
    .choice:focus-visible { outline: 3px solid rgba(201, 99, 57, .28); outline-offset: 3px; }
    .letter { flex: 0 0 46px; height: 46px; border-radius: 50% 46% 52% 44%; display: grid; place-items: center; color: #fff; font: 800 1.35rem/1 system-ui, sans-serif; transform: rotate(-3deg); }
    .choice:nth-child(odd) .letter { background: var(--orange); }
    .choice:nth-child(even) .letter { background: var(--olive); }
    .choice strong { display: block; font-size: 1rem; line-height: 1.45; }
    .choice span:last-child { color: var(--muted); font-size: .88rem; line-height: 1.4; }
    .micro { text-align: center; color: var(--muted); font-size: .83rem; margin: 19px 0 0; }
    .result { display: none; padding: clamp(24px, 5vw, 54px); }
    .result.active { display: block; animation: rise .36s ease both; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .result-top { max-width: 720px; margin: 0 auto; text-align: center; }
    .result-badge { width: 62px; height: 62px; margin: 0 auto 15px; border-radius: 50% 46% 52% 44%; display: grid; place-items: center; color: white; font: 800 1.7rem/1 system-ui, sans-serif; background: var(--orange); transform: rotate(-3deg); }
    .result h2 { font-size: clamp(1.85rem, 5vw, 3rem); margin: 0 0 10px; line-height: 1.25; }
    .result .subtitle { color: var(--olive); font-weight: 700; font-size: 1.08rem; margin: 0 0 20px; }
    .result .opening { color: var(--muted); line-height: 1.9; font-size: 1.03rem; margin: 0 auto; max-width: 650px; }
    .reading { max-width: 720px; margin: 35px auto 0; display: grid; gap: 14px; }
    .section { padding: 22px; border: 1px solid var(--line); border-radius: 20px; background: rgba(255, 251, 242, .66); }
    .section h3 { margin: 0 0 9px; font-size: 1.08rem; display: flex; align-items: center; gap: 9px; }
    .section h3::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--orange); box-shadow: 14px 0 0 var(--olive); margin-right: 14px; }
    .section p { margin: 0; color: #554d44; line-height: 1.9; }
    .action { background: linear-gradient(135deg, rgba(241, 213, 184, .82), rgba(223, 225, 197, .78)); border-color: transparent; }
    .action strong { color: var(--orange); }
    details { max-width: 720px; margin: 18px auto 0; border-top: 1px solid var(--line); padding-top: 18px; }
    summary { cursor: pointer; font-weight: 700; color: var(--olive); padding: 8px 0; }
    .others { display: grid; gap: 9px; margin-top: 10px; }
    .other-btn { display: flex; justify-content: space-between; align-items: center; padding: 13px 15px; border: 1px solid var(--line); border-radius: 14px; background: rgba(255,255,255,.38); color: var(--ink); cursor: pointer; text-align: left; }
    .other-btn:hover { border-color: var(--olive); }
    .restart { display: block; margin: 28px auto 0; padding: 12px 19px; border-radius: 999px; border: 1px solid var(--ink); color: var(--ink); background: transparent; cursor: pointer; }
    footer { text-align: center; color: var(--muted); font-size: .78rem; line-height: 1.7; padding: 24px 14px 0; }
    .signature { color: var(--ink); font-weight: 700; margin-bottom: 7px; letter-spacing: .05em; }
    @media (max-width: 720px) {
      .shell { width: min(100% - 20px, 560px); padding-top: 18px; }
      .card { border-radius: 23px; }
      .intro, .result { padding: 24px 18px 30px; }
      .hero { grid-template-columns: 1fr; gap: 22px; }
      .copy { text-align: center; }
      .image-frame { order: 2; width: min(100%, 460px); margin: 0 auto; }
      h1 { font-size: clamp(2.05rem, 11vw, 3rem); }
      .prompt { margin-top: 30px; }
      .choices { grid-template-columns: 1fr; }
      .choice { min-height: 82px; }
    }
    @media (max-width: 380px) {
      .shell { width: min(100% - 14px, 360px); }
      .intro, .result { padding-inline: 14px; }
      .choice { padding: 13px; gap: 11px; }
      .letter { flex-basis: 42px; height: 42px; }
    }
    @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; animation: none !important; transition: none !important; } }
  </style>
</head>

    const intro = document.getElementById('intro');
    const result = document.getElementById('result');
    const fields = ['Letter','Title','Subtitle','Opening','State','Need','Action','Words'];

    function showResult(key) {
      const data = results[key];
      document.getElementById('resultLetter').textContent = key;
      document.getElementById('resultTitle').textContent = data.title;
      document.getElementById('resultSubtitle').textContent = data.subtitle;
      document.getElementById('resultOpening').textContent = data.opening;
      document.getElementById('resultState').textContent = data.state;
      document.getElementById('resultNeed').textContent = data.need;
      document.getElementById('resultAction').textContent = data.action;
      document.getElementById('resultWords').textContent = data.words;
      const others = document.getElementById('otherResults');
      others.innerHTML = Object.keys(results).filter(k => k !== key).map(k =>
        `<button class="other-btn" data-other="${k}"><span><strong>${k}</strong>　${results[k].title}</span><span>看解析 →</span></button>`
      ).join('');
      intro.hidden = true;
      result.classList.add('active');
      result.style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
      setTimeout(() => result.focus({ preventScroll: true }), 350);
    }

    document.querySelectorAll('.choice').forEach(btn => btn.addEventListener('click', () => showResult(btn.dataset.choice)));
    document.getElementById('otherResults').addEventListener('click', e => {
      const btn = e.target.closest('[data-other]');
      if (btn) showResult(btn.dataset.other);
    });
    document.getElementById('restart').addEventListener('click', () => {
      result.classList.remove('active');
      result.style.display = 'none';
      intro.hidden = false;
      window.scrollTo({ top: 0, behavior: 'smooth' });
      setTimeout(() => document.querySelector('.choice').focus({ preventScroll: true }), 350);
    });
  </script>
</body>
</html>
