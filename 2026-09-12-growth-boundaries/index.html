<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>柔柔｜妳正在經歷哪一種成長</title>
  <meta name="description" content="從第一反應，看見妳在關係裡最需要練習的成長功課">
  <meta name="theme-color" content="#f7f0e7">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23f3d4cf'/%3E%3Cpath d='M32 49S13 39 13 25c0-10 13-14 19-5 6-9 19-5 19 5 0 14-19 24-19 24Z' fill='%237f4d49'/%3E%3C/svg%3E">
  <style>
    :root {
      --ink: #332b2a;
      --muted: #776a66;
      --paper: #fffaf3;
      --page: #f5ede4;
      --rose: #b86f69;
      --rose-soft: #f3d9d4;
      --sage-soft: #dfe6d8;
      --blue-soft: #dfe9eb;
      --gold-soft: #f3df9e;
      --line: #e5d6ca;
      --shadow: 0 22px 70px rgba(73, 50, 41, .12);
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 8% 10%, rgba(243, 217, 212, .7), transparent 28rem),
        radial-gradient(circle at 90% 30%, rgba(223, 230, 216, .72), transparent 30rem),
        var(--page);
      font-family: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
      line-height: 1.75;
    }

    button { font: inherit; }

    .page {
      width: min(1180px, calc(100% - 32px));
      margin: 28px auto;
      padding: clamp(28px, 5vw, 68px);
      background:
        linear-gradient(rgba(255, 250, 243, .94), rgba(255, 250, 243, .94)),
        repeating-linear-gradient(45deg, #eadfd4 0 1px, transparent 1px 5px);
      border: 1px solid rgba(92, 68, 59, .15);
      border-radius: 34px;
      box-shadow: var(--shadow);
      overflow: hidden;
      position: relative;
    }

    .page::before {
      content: "";
      position: absolute;
      inset: 0 0 auto;
      height: 6px;
      background: linear-gradient(90deg, #343442, var(--rose), #d5aa66);
    }

    .intro {
      text-align: center;
      max-width: 760px;
      margin: 0 auto 36px;
      position: relative;
    }

    .intro::before,
    .intro::after {
      position: absolute;
      color: rgba(184, 111, 105, .48);
      font-family: system-ui, sans-serif;
      pointer-events: none;
    }

    .intro::before { content: "✦  ·  ♡"; left: -5%; top: 34%; transform: rotate(-10deg); }
    .intro::after { content: "♡  ·  ✦"; right: -4%; bottom: 7%; transform: rotate(8deg); }

    .eyebrow,
    .section-tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 14px;
      padding: 5px 14px;
      border-radius: 999px;
      color: #7b4e4a;
      background: var(--rose-soft);
      font-size: .9rem;
      letter-spacing: .08em;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.2rem, 6vw, 4.8rem);
      line-height: 1.2;
      letter-spacing: -.035em;
      font-weight: 800;
    }

    h1 span { color: var(--rose); }

    .intro-copy {
      margin: 18px auto 0;
      color: var(--muted);
      font-size: clamp(1rem, 2vw, 1.15rem);
    }

    .rule {
      display: flex;
      align-items: center;
      gap: 16px;
      color: #b68780;
      margin: 28px auto;
      max-width: 520px;
    }

    .rule::before,
    .rule::after {
      content: "";
      height: 1px;
      flex: 1;
      background: var(--line);
    }

    .quiz-heading {
      margin: 0 0 22px;
      text-align: center;
      font-size: clamp(1.45rem, 3vw, 2.2rem);
      line-height: 1.45;
    }

    .choices {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
      max-width: 960px;
      margin: 0 auto;
    }

    .choice {
      --tint: var(--rose-soft);
      padding: 0;
      text-align: left;
      color: var(--ink);
      border: 1px solid rgba(89, 66, 58, .13);
      border-radius: 24px;
      background: color-mix(in srgb, var(--tint) 65%, white);
      overflow: hidden;
      cursor: pointer;
      box-shadow: 0 8px 22px rgba(70, 48, 39, .07);
      transition: transform .22s ease, box-shadow .22s ease, border-color .22s ease;
    }

    .choice:nth-child(2) { --tint: var(--sage-soft); }
    .choice:nth-child(3) { --tint: var(--blue-soft); }
    .choice:nth-child(4) { --tint: #f3e5cf; }

    .choice:hover { transform: translateY(-4px); box-shadow: 0 16px 34px rgba(70, 48, 39, .13); }
    .choice:focus-visible { outline: 4px solid rgba(184, 111, 105, .28); outline-offset: 3px; }
    .choice[aria-pressed="true"] { border-color: var(--rose); box-shadow: 0 0 0 3px rgba(184, 111, 105, .15); }

    .choice img {
      display: block;
      width: 100%;
      aspect-ratio: 500 / 235;
      object-fit: cover;
      object-position: center;
      border-bottom: 1px solid rgba(89, 66, 58, .12);
    }

    .choice-copy {
      display: grid;
      grid-template-columns: 50px 1fr;
      align-items: center;
      gap: 10px;
      min-height: 94px;
      padding: 14px 18px 16px;
    }

    .letter {
      display: grid;
      place-items: center;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      color: white;
      background: var(--ink);
      font-family: system-ui, sans-serif;
      font-size: 1.45rem;
      font-weight: 800;
    }

    .choice strong { display: block; font-size: 1.2rem; line-height: 1.35; }
    .choice small { display: block; margin-top: 4px; color: var(--muted); font-size: .92rem; }

    .result {
      max-width: 880px;
      margin: 44px auto 0;
      padding: clamp(24px, 5vw, 48px);
      border: 1px solid rgba(89, 66, 58, .14);
      border-radius: 28px;
      background: rgba(255, 255, 255, .7);
      box-shadow: 0 16px 46px rgba(70, 48, 39, .09);
      position: relative;
      overflow: hidden;
    }

    .result::after {
      content: "✦";
      position: absolute;
      right: 22px;
      top: 16px;
      color: rgba(184, 111, 105, .32);
      font-size: 2rem;
      transform: rotate(12deg);
    }

    .result[hidden] { display: none; }

    .result-kicker {
      margin: 0;
      color: var(--rose);
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: .08em;
    }

    .result h2 {
      margin: 8px 0 16px;
      font-size: clamp(1.75rem, 4vw, 3rem);
      line-height: 1.35;
    }

    .result-lead { margin: 0; color: #554a47; font-size: 1.08rem; }
    .lead-paragraph { display: block; }
    .lead-paragraph + .lead-paragraph { margin-top: 14px; }

    .trait-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 20px 0 0;
      padding: 0;
      list-style: none;
    }

    .trait-list li {
      padding: 6px 12px;
      border: 1px solid rgba(184, 111, 105, .2);
      border-radius: 999px;
      color: #75504c;
      background: #fff7f4;
      font-size: .92rem;
    }

    .pattern-line {
      margin: 24px 0 0;
      padding: 18px 20px;
      border-radius: 18px;
      background: linear-gradient(135deg, #f8e8e3, #fff9f4);
      color: #634742;
      font-size: 1.06rem;
      font-weight: 700;
    }

    .insights {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 28px;
    }

    .insight {
      padding: 22px;
      border-radius: 20px;
      background: #fbf3ec;
    }

    .insight:nth-child(2) { background: #f0f3ec; }
    .insight:nth-child(3) { background: #eef3f3; }
    .insight:nth-child(4) { background: #f7f0e3; }
    .insight h3 { margin: 0 0 8px; font-size: 1.05rem; color: #7b4e4a; }
    .insight p { margin: 0; color: #5f5350; }

    .deep-dive {
      margin-top: 18px;
      padding: 24px;
      border: 1px dashed rgba(123, 78, 74, .24);
      border-radius: 20px;
      background: rgba(255, 250, 243, .78);
      position: relative;
    }

    .deep-dive::before {
      content: "“";
      position: absolute;
      right: 20px;
      top: -12px;
      color: rgba(184, 111, 105, .2);
      font-size: 5rem;
      line-height: 1;
    }

    .deep-dive h3,
    .safety h3,
    .growth-signs h3 { margin: 0 0 8px; color: #7b4e4a; font-size: 1.1rem; }
    .deep-dive p,
    .safety p { margin: 0; color: #5f5350; }

    .safety {
      margin-top: 18px;
      padding: 22px 24px 22px 70px;
      border-radius: 20px;
      background: #f0f3ec;
      position: relative;
    }

    .safety::before {
      content: "♡";
      position: absolute;
      left: 24px;
      top: 21px;
      display: grid;
      place-items: center;
      width: 32px;
      height: 32px;
      border: 1px solid rgba(123, 78, 74, .25);
      border-radius: 50%;
      color: var(--rose);
      font-family: system-ui, sans-serif;
    }

    .practice {
      margin-top: 22px;
      padding: 22px 24px;
      border-left: 4px solid var(--rose);
      border-radius: 4px 18px 18px 4px;
      background: #fff7f4;
    }

    .practice h3 { margin: 0 0 8px; font-size: 1.15rem; }
    .practice ol { margin: 0; padding-left: 1.3em; color: #5f5350; }
    .practice li + li { margin-top: 7px; }

    .growth-signs {
      margin-top: 18px;
      padding: 22px 24px;
      border-radius: 20px;
      background: #eef3f3;
    }

    .growth-signs ul { margin: 0; padding: 0; list-style: none; color: #5f5350; }
    .growth-signs li { position: relative; padding-left: 1.6em; }
    .growth-signs li + li { margin-top: 7px; }
    .growth-signs li::before { content: "✦"; position: absolute; left: 0; color: var(--rose); }

    .rourou-note {
      margin: 24px 0 0;
      padding: 20px 22px;
      border-radius: 18px;
      background: var(--gold-soft);
      font-size: 1.08rem;
      font-weight: 700;
    }

    .again {
      display: block;
      margin: 22px auto 0;
      padding: 10px 18px;
      border: 0;
      border-bottom: 1px solid var(--ink);
      color: var(--ink);
      background: transparent;
      cursor: pointer;
    }

    footer {
      max-width: 760px;
      margin: 34px auto 0;
      text-align: center;
      color: #8b7c77;
      font-size: .88rem;
    }

    @media (max-width: 720px) {
      .page { width: calc(100% - 20px); margin: 10px auto; padding: 28px 14px 34px; border-radius: 24px; }
      .intro { margin-bottom: 26px; }
      .choices { gap: 12px; }
      .choice-copy { grid-template-columns: 38px 1fr; min-height: 88px; padding: 12px; }
      .letter { width: 36px; height: 36px; font-size: 1.15rem; }
      .choice strong { font-size: .98rem; }
      .choice small { display: none; }
      .insights { grid-template-columns: 1fr; }
      .result { margin-top: 30px; border-radius: 22px; }
      .intro::before, .intro::after { display: none; }
    }

    @media (max-width: 430px) {
      h1 { font-size: 2.15rem; }
      .quiz-heading { font-size: 1.32rem; }
      .choices { gap: 10px; }
      .choice { position: relative; background: transparent; }
      .choice img {
        aspect-ratio: 1.45;
        object-fit: cover;
        object-position: center;
        border-bottom: 0;
      }
      .choice-copy {
        position: absolute;
        left: 8px;
        right: 6px;
        bottom: 7px;
        display: grid;
        grid-template-columns: 27px minmax(0, 1fr);
        gap: 6px;
        min-height: 0;
        padding: 0;
        background: transparent;
        pointer-events: none;
      }
      .letter {
        margin: 0;
        width: 26px;
        height: 26px;
        font-size: .82rem;
      }
      .choice strong {
        color: #292322;
        font-size: .78rem;
        line-height: 1.18;
        text-shadow:
          0 1px 0 rgba(255, 255, 255, .98),
          0 -1px 0 rgba(255, 255, 255, .98),
          1px 0 0 rgba(255, 255, 255, .98),
          -1px 0 0 rgba(255, 255, 255, .98),
          0 0 7px rgba(255, 250, 243, 1);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .choice { transition: none; }
    }
  </style>
</head>

    const result = document.querySelector("#result");
    const choices = [...document.querySelectorAll(".choice")];

    function renderResult(key, shouldScroll = true) {
      const data = results[key];
      if (!data) return;

      choices.forEach((button) => button.setAttribute("aria-pressed", String(button.dataset.choice === key)));
      document.querySelector("#result-kicker").textContent = data.kicker;
      document.querySelector("#result-title").textContent = data.title;
      document.querySelector("#result-lead").innerHTML = data.lead.map((paragraph) => `<span class="lead-paragraph">${paragraph}</span>`).join("");
      document.querySelector("#result-traits").innerHTML = data.traits.map((item) => `<li>${item}</li>`).join("");
      document.querySelector("#result-pattern").textContent = data.pattern;
      document.querySelector("#result-outward").textContent = data.outward;
      document.querySelector("#result-fear").textContent = data.fear;
      document.querySelector("#result-cycle").textContent = data.cycle;
      document.querySelector("#result-misunderstood").textContent = data.misunderstood;
      document.querySelector("#result-roots").textContent = data.roots;
      document.querySelector("#result-need").textContent = data.need;
      document.querySelector("#result-practice").innerHTML = data.practice.map((item) => `<li>${item}</li>`).join("");
      document.querySelector("#result-signs").innerHTML = data.signs.map((item) => `<li>${item}</li>`).join("");
      document.querySelector("#result-note").textContent = data.note;
      result.hidden = false;
      history.replaceState(null, "", `#${key}`);

      if (shouldScroll) {
        result.scrollIntoView({ behavior: "smooth", block: "start" });
        result.focus({ preventScroll: true });
      }
    }

    choices.forEach((button) => button.addEventListener("click", () => renderResult(button.dataset.choice)));

    document.querySelector("#again").addEventListener("click", () => {
      result.hidden = true;
      choices.forEach((button) => button.setAttribute("aria-pressed", "false"));
      history.replaceState(null, "", location.pathname);
      document.querySelector("#quiz-question").scrollIntoView({ behavior: "smooth", block: "start" });
      choices[0].focus({ preventScroll: true });
    });

    const initial = location.hash.slice(1).toUpperCase();
    if (results[initial]) renderResult(initial, false);
  </script>
