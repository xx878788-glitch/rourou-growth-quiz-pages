<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fbf4e5" />
    <meta name="description" content="憑第一眼選一張最想走進的畫面，看看此刻的你最需要什麼" />
    <title>柔柔的直覺選圖｜現在的你需要什麼</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="stylesheet" href="./style.css" />
    <script src="./app.js" defer></script>
  </head>
  <body>
    <main class="page-shell">
      <div class="quiz-layout">
        <header class="intro">
          <p class="eyebrow"><span class="tiny-bow" aria-hidden="true"></span> 柔柔的直覺選圖</p>
          <h1>現在的你<br />最想走進哪個畫面</h1>
          <p class="intro-copy">先看圖三秒<br />憑第一眼選一張就好</p>
          <p class="intro-note">選完會看到你此刻可能最需要的提醒<br />還有一件今天就能做的小事</p>
        </header>

        <section class="choices" aria-label="選一張最想走進的畫面" id="choices">
          <button class="choice choice-a" type="button" data-choice="A" aria-label="A 有燈光的房間" aria-pressed="false">
            <span class="choice-art"><img src="./assets/quiz-scenes.webp" alt="" /></span>
            <span class="choice-label" aria-hidden="true">A</span>
          </button>
          <button class="choice choice-b" type="button" data-choice="B" aria-label="B 通往海邊的路" aria-pressed="false">
            <span class="choice-art"><img src="./assets/quiz-scenes.webp" alt="" /></span>
            <span class="choice-label" aria-hidden="true">B</span>
          </button>
          <button class="choice choice-c" type="button" data-choice="C" aria-label="C 一起吃麵包的朋友" aria-pressed="false">
            <span class="choice-art"><img src="./assets/quiz-scenes.webp" alt="" /></span>
            <span class="choice-label" aria-hidden="true">C</span>
          </button>
          <button class="choice choice-d" type="button" data-choice="D" aria-label="D 窗邊的空白筆記本" aria-pressed="false">
            <span class="choice-art"><img src="./assets/quiz-scenes.webp" alt="" /></span>
            <span class="choice-label" aria-hidden="true">D</span>
          </button>
        </section>
      </div>

      <section id="result" class="result" aria-live="polite" hidden tabindex="-1">
        <div class="result-topline"><span id="result-letter" class="result-letter"></span><span>給現在的你</span></div>
        <h2 id="result-title"></h2>
        <p id="result-lead" class="result-lead"></p>
        <div class="result-sections">
          <div><h3>你可能正在經歷</h3><p id="result-now"></p></div>
          <div><h3>讓你卡住的地方</h3><p id="result-stuck"></p></div>
          <div class="small-step"><h3>今天可以先做的一小步</h3><p id="result-step"></p></div>
        </div>
        <p id="result-note" class="result-note"></p>
        <button id="retry" class="retry" type="button">換一張看看</button>
      </section>

      <footer class="footer">先照顧好眼前的自己，再慢慢往前走</footer>
    </main>
  </body>
</html>
