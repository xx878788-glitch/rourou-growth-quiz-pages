      <h3>那些東西，為什麼一直留著</h3>
      <p>妳拉開抽屜，看到一條不知道配哪台機器的線、幾個捨不得丟的紙袋，心裡很快就會冒出一句：「萬一哪天用得到呢？」妳並不是不知道它們占地方，只是想到要丟，就會先想到以後可能發生的麻煩。留著的當下，好像替未來的自己多準備了一條路。</p>
      <p>這種心情有時也會出現在生活的其他地方。明明手上的安排已經夠多，妳還是先答應別人的請託；明明一個選擇早就不合適，妳仍把它留在心裡，怕哪天後悔。妳很擅長預想各種狀況，於是連很小的決定，也常常要等到「確定不會出錯」才能放心做。</p>
      <h3>整理時，也在練習相信自己</h3>
      <p>當妳真正想留下某樣東西，理由通常很具體：它現在就在用，下個月會用，或者它對妳真的有紀念意義。「以後可能會用到」卻像一張無限期的保留票，讓抽屜慢慢裝滿了還沒發生的事。東西越多，找一件真的需要的東西反而越費力。</p>
      <p>妳可以不必一次把整個家清空。先拿起其中一件，問自己：「如果它今天不在了，我真的需要它時，可以怎麼辦？」有些東西很難替代，值得留下；有些東西其實能借、能再買，或根本已經用不上。看見這個差別，不代表妳對未來不用心，而是妳開始相信：即使將來需要，妳也有能力處理。</p>

      <h3>它一直在衣櫃裡提醒妳什麼</h3>
      <p>妳也許曾經很喜歡那條褲子。買下它時想著，等某一天穿上，自己會更有自信。可是後來每次打開衣櫃，它像是在問：「妳怎麼還沒變成那個樣子？」妳只是要找件衣服出門，卻先被提醒了一次自己還沒達成的期待。</p>
      <p>最難受的地方，往往不是褲子現在合不合身，而是它把「值得打扮、值得被看見」放到了以後。妳可能會把喜歡的場合、漂亮的照片，甚至單純穿得舒服的權利，都跟某個將來的身形綁在一起。日子於是變成漫長的等待：先改變自己，才允許自己享受。</p>

      <p>身體會隨生活、年紀、壓力與日常節奏改變；衣服本來就應該服務穿衣服的人。穿不下某件衣服，是尺碼和當下不合，並不能用來判斷妳是否自律、是否好看，更不能衡量妳值不值得被愛。</p>

    D: {kicker:'D｜只寫了三頁的筆記本',title:'妳想放下的，可能是完美的開始',lead:'妳不是沒有行動力，可能只是把第一步想得太重要了。',html:`
      <h3>那三頁為什麼停在那裡</h3>
      <p>買那本筆記本時，妳也許真的很期待。封面要好看，第一頁要整齊，最好能從此變成每天都會記錄的人。前三頁寫下去的時候很有熱情；漏掉一天之後，卻突然不知道該怎麼接。空白越積越多，再打開它，看到的彷彿不是紙，而是「又沒有堅持下去」的證據。</p>
      <p>同樣的感覺也可能出現在想學的技能、想經營的生活習慣裡。妳不是不想開始，而是太希望這一次能做好，所以格外在意起點。等到時間剛好、狀態剛好、工具都準備好，妳才願意踏出去；但生活很少替人準備那麼完整的開場。</p>
      <h3>重新開始，也可以接在第三頁後面</h3>
      <p>一本只寫了三頁的本子，不一定是失敗。那三頁證明妳曾經在某個時刻認真想過自己的生活。第四頁可以隔很久才寫，可以字跡凌亂，可以只有一句「今天有點累」。它不需要接得漂亮，也不需要補完中間的空白。</p>
      <p>如果厚厚的本子讓妳有壓力，就換一本小而薄的；如果妳還喜歡舊的，就直接翻到下一頁。真正要練習的不是找到一本讓自己永不間斷的筆記本，而是允許自己停過、亂過，還能繼續。妳不必先成為一個很會堅持的人，才有資格寫下今天。</p>
      <div class="quote">不是從頭來過也沒關係。妳可以從今天所在的地方接著走。</div>
      <div class="exercise"><h3>今天可以試的小動作</h3><p>打開那本筆記本，或拿一張手邊的紙，只寫一句現在想到的話。不補進度、不訂每天的目標，也不需要寫得有意義。明天如果忘了，就改天再寫下一句。讓開始成為一件可以重複做的小事。</p></div>`}
  };
  const resultEl=document.getElementById('result');
  function show(choice,scroll){
    const r=results[choice];if(!r)return;
    document.getElementById('result-kicker').textContent=r.kicker;
    document.getElementById('result-title').textContent=r.title;
    document.getElementById('result-lead').textContent=r.lead;
    document.getElementById('result-article').innerHTML=r.html;
    resultEl.classList.add('active');
    document.title=`${choice}｜${r.title}｜柔柔`;
    if(scroll)requestAnimationFrame(()=>resultEl.scrollIntoView({behavior:'smooth',block:'start'}));
  }
  document.querySelectorAll('[data-choice]').forEach(button=>button.addEventListener('click',()=>{const choice=button.dataset.choice;history.replaceState(null,'','#'+choice);show(choice,true)}));
  document.getElementById('restart').addEventListener('click',()=>{history.replaceState(null,'',location.pathname+location.search);resultEl.classList.remove('active');document.title='柔柔｜妳現在最想放下什麼？';document.getElementById('start').scrollIntoView({behavior:'smooth',block:'start'})});
  window.addEventListener('hashchange',()=>{const choice=decodeURIComponent(location.hash.slice(1)).toUpperCase();if(results[choice])show(choice,true)});
  const initial=decodeURIComponent(location.hash.slice(1)).toUpperCase();if(results[initial])show(initial,false);
</script>
</body>
</html>
