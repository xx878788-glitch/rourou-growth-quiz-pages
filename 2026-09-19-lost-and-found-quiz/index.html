<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>柔柔｜失物招領所心理測驗</title>
<meta name="description" content="凌晨三點，妳走進一間沒有人的失物招領所。櫃子裡放著四樣被遺忘的東西，憑第一眼的感覺，選出妳最想帶走的那一樣。">
<meta property="og:title" content="柔柔｜失物招領所心理測驗">
<meta property="og:description" content="凌晨三點，妳走進一間沒有人的失物招領所。四樣被遺忘的東西，哪一樣讓妳忍不住多看了一眼？">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233c4a63'/%3E%3Cpath d='M16 6l2.6 6.4L25 15l-6.4 2.6L16 24l-2.6-6.4L7 15l6.4-2.6z' fill='%23f3e2c0'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#efe4d6;--paper:#fffaf2;--ink:#3b2f2a;--accent:#a8714a;
  --gold:#e9d3ad;--border:#ddc9ae;--muted:#7a6558;--night:#3c4a63;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.9 system-ui,"Noto Sans TC",sans-serif}
main{max-width:680px;margin:auto;padding:30px 24px 40px}
h1,h2,h3,blockquote{font-family:"Noto Serif TC","Songti TC",serif}
h1{font-size:clamp(1.45rem,4.4vw,2rem);line-height:1.6;margin:16px auto;max-width:900px;white-space:pre-line}
h2{font-size:1.5rem;line-height:1.6}
h3{font-size:1.2rem;margin:12px 0 8px}
p{margin:10px 0 20px}
button,a{touch-action:manipulation}
button{font:inherit;cursor:pointer;color:inherit}
.tag{display:inline-block;border-radius:30px;padding:4px 14px;background:var(--night);color:#fff;font-size:.875rem;font-weight:700;letter-spacing:.04em}
.muted{color:var(--muted);font-size:.9rem}
.card{background:var(--paper);border:2px solid var(--border);border-radius:22px;padding:24px;margin:24px 0;box-shadow:5px 5px 0 var(--ink)}
.btn{display:inline-block;border:2px solid var(--border);border-radius:30px;background:var(--accent);color:#fff;padding:12px 26px;text-decoration:none;font-weight:750;box-shadow:4px 4px 0 var(--ink);max-width:100%}
.btn[aria-disabled=true]{opacity:.45;pointer-events:none}
.secondary{background:none;border:0;text-decoration:underline;text-underline-offset:5px;font-size:.9rem;margin-top:16px;padding:8px;color:var(--muted)}

/* ── 第一頁 ── */
.hero{text-align:center;margin-bottom:26px}
.hero h1{margin-bottom:14px}
.lead{white-space:pre-line;line-height:2;color:var(--ink);max-width:560px;margin:0 auto}
.choose-layout{display:grid;grid-template-columns:1.1fr 1fr;gap:34px;align-items:center}
.quiz-art{display:block;width:100%;height:auto;border:2px solid var(--border);border-radius:18px;box-shadow:5px 5px 0 var(--border)}
.question{font-family:"Noto Serif TC","Songti TC",serif;font-size:1.3rem;line-height:1.7;margin:0 0 18px}
.opts{display:grid;gap:14px}
.pick{display:flex;text-align:left;align-items:center;gap:14px;border:2px solid var(--border);background:var(--paper);border-radius:16px;padding:18px;box-shadow:4px 4px 0 var(--ink);width:100%}
.letter{display:grid;place-items:center;flex-shrink:0;width:36px;height:36px;border-radius:50%;background:var(--gold);font-weight:800}
.note{white-space:pre-line;text-align:center;color:var(--muted);font-size:.9rem;line-height:1.9;margin-top:22px}

/* ── 結果頁 ── */
#result{max-width:640px;margin:auto}
section[hidden]{display:none!important}
.label{color:var(--accent);font-weight:750;font-size:.95rem;margin-bottom:6px}
.long-copy{white-space:pre-line;line-height:2}
.long-copy+.label{margin-top:30px}
.long-copy.boxed{background:#f8efe2;border-radius:12px;padding:16px 18px}
blockquote{border-left:4px solid var(--accent);background:#f8efe2;border-radius:8px;margin:0;padding:16px 20px;font-size:1.12rem;font-weight:700;line-height:1.9;white-space:pre-line}
.gemhead{display:flex;align-items:center;gap:18px}
.gemhead img{width:120px;height:150px;object-fit:cover;border-radius:12px;border:2px solid var(--border)}
.gemhead div{flex:1;min-width:0}
.gemhead h3{color:var(--accent);margin-top:0}
.gem-meaning{margin:18px 0 6px}
details{border:2px solid var(--border);border-radius:14px;background:var(--paper);margin:12px 0;padding:14px 18px}
summary{font-weight:700;cursor:pointer}
.coupon[hidden]{display:none}
.coupon{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;border:2px dashed var(--accent);border-radius:20px;background:var(--gold);padding:16px 20px;margin:22px 0}
.coupon p{margin:0;flex:1;min-width:180px}
.coupon strong{font-family:serif;color:var(--accent);font-size:1.2rem;letter-spacing:.04em}
.coupon button{background:var(--paper);border:2px solid var(--accent);color:var(--accent);border-radius:24px;font-size:.9rem;font-weight:700;padding:7px 18px}
.more-crystals{color:var(--muted);font-size:.95rem;margin:22px 0 30px}
.more-crystals a{color:var(--accent);font-weight:700;text-decoration:none;border-bottom:2px solid var(--gold)}
.shop{text-align:center;border-top:2px solid var(--border);margin-top:35px;padding-top:25px}
footer{text-align:center;font-size:.9rem;color:var(--accent);margin-top:24px}
.quiz-disclaimer{text-align:center;white-space:pre-line;color:#8a7763;font-size:.85rem;line-height:1.9;margin:20px auto 0;padding:0 8px;max-width:620px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:5px}

/* ── 佔位樣式：內容補上後自動消失 ── */
.ph{display:grid;place-items:center;text-align:center;background:repeating-linear-gradient(45deg,#f5eadb,#f5eadb 10px,#eee0cb 10px,#eee0cb 20px);border:2px dashed var(--border);border-radius:18px;color:#a08a72;font-size:.85rem;letter-spacing:.05em}
.quiz-art.ph{aspect-ratio:4/5}
.gemhead .ph{width:120px;height:150px;border-radius:12px;flex-shrink:0}
.todo{color:#a08a72}

@media(max-width:700px){
  .choose-layout{grid-template-columns:1fr;gap:26px}
  .quiz-art{max-width:420px;margin:auto}
  .choose-panel{max-width:460px;width:100%;margin:auto}
}
@media(min-width:800px){main:has(#intro:not([hidden])){max-width:1040px}}
@media(max-width:380px){
  main{padding:24px 16px}.card{padding:20px}
  .gemhead{gap:12px}.gemhead img,.gemhead .ph{width:90px;height:120px}
}
@media(prefers-reduced-motion:no-preference){
  .pick,.btn{transition:transform .2s}
  .pick:hover,.btn:hover{transform:translateY(-2px)}
}
</style>
</head>
<body>
<main>

<!-- ══ 第一頁：題目 ══════════════════════════════ -->
<section id="intro">
  <header class="hero">
    <span class="tag" id="brand-tag"></span>
    <h1 id="quiz-title"></h1>
    <p class="lead" id="quiz-lead"></p>
  </header>
  <div class="choose-layout">
    <div id="quiz-art-slot"></div>
    <div class="choose-panel">
      <p class="question" id="quiz-question"></p>
      <div id="options" class="opts" aria-label="選擇一個選項查看解析"></div>
      <p class="note" id="quiz-note"></p>
    </div>
  </div>
</section>

<!-- ══ 第二頁：結果 ══════════════════════════════ -->
<section id="result" hidden>
  <span class="tag" id="result-tag"></span>
  <h1 id="result-title" tabindex="-1"></h1>
  <p id="result-pick" class="muted"></p>

  <div class="card" id="reading-card"></div>

  <div class="label" id="shop-label"></div>
  <h2 id="gem-heading"></h2>
  <p id="bridge"></p>

  <div class="card">
    <div class="gemhead">
      <div id="gem-img-slot"></div>
      <div>
        <h3 id="gem-name"></h3>
        <p id="gem-stones" class="muted"></p>
      </div>
    </div>
    <div class="label gem-meaning" id="gem-meaning-label">象徵涵義</div>
    <p class="long-copy" id="gem-meaning"></p>
    <div class="label" id="gem-why-label">適合妳的原因</div>
    <p class="long-copy" id="gem-why"></p>
    <a class="btn" id="gem-link" target="_blank" rel="noopener"></a>
  </div>

  <div class="coupon" id="coupon" hidden>
    <p>使用專屬折扣碼「<strong id="coupon-code"></strong>」<span id="coupon-desc"></span></p>
    <button type="button" id="copy-code">複製</button>
    <span id="copy-status" class="sr-only" role="status" aria-live="polite"></span>
  </div>

  <p class="more-crystals" id="more-wrap">想看看其他適合妳的<br><a id="more-link" target="_blank" rel="noopener"></a></p>

  <h2 id="others-heading"></h2>
  <div id="others"></div>

  <div class="card" id="closing-card"></div>

  <div class="shop">
    <h2 id="shop-heading"></h2>
    <p id="shop-copy"></p>
    <a class="btn" id="shop-link" target="_blank" rel="noopener"></a>
    <br><button class="secondary" id="restart"></button>
  </div>
</section>

<footer id="footer"></footer>
<p class="quiz-disclaimer" id="disclaimer"></p>
</main>

/* ═══ 以下是程式，通常不用動 ═══════════════════════════════ */

const $ = id => document.getElementById(id);
const LETTERS = 'ABCDEFGH';

/** 必填欄位：有值就填，沒值顯示灰色待補提示 */
function fill(el, text, hint){
  if(!el) return;
  el.hidden = false;
  el.classList.toggle('todo', !text);
  el.textContent = text || ('（' + hint + '待補）');
}

/** 選填欄位：沒值就整個隱藏 */
function fillOptional(el, text){
  if(!el) return;
  el.textContent = text || '';
  el.hidden = !text;
}

/** 圖片：有路徑就 <img>，沒有就虛線佔位框 */
function imageOrPlaceholder(slot, src, alt, hint, className){
  slot.replaceChildren();
  const node = document.createElement('div');
  if(src){
    const img = document.createElement('img');
    img.src = src; img.alt = alt || '';
    if(className) img.className = className;
    slot.append(img);
    return;
  }
  node.className = 'ph' + (className ? ' ' + className : '');
  node.textContent = hint;
  slot.append(node);
}

/** 連結：沒 url 就變成不可點的灰按鈕 */
function linkOrDisabled(el, url, text){
  el.textContent = text;
  if(url){
    el.href = url;
    el.removeAttribute('aria-disabled');
    el.removeAttribute('title');
  }else{
    el.removeAttribute('href');
    el.setAttribute('aria-disabled','true');
    el.title = '連結待補';
  }
}

/* ── 第一頁與共用區塊 ── */
function renderStatic(){
  fillOptional($('brand-tag'), DATA.brandTag);
  fill($('quiz-title'),    DATA.quizTitle,    '主標題');
  fillOptional($('quiz-lead'), DATA.quizLead);
  fill($('quiz-question'), DATA.quizQuestion, '問題');
  fillOptional($('quiz-note'), DATA.quizNote);
  imageOrPlaceholder($('quiz-art-slot'), DATA.quizArt, DATA.quizArtAlt, '題目插圖待補', 'quiz-art');

  fillOptional($('result-tag'),   DATA.resultTag);
  fillOptional($('shop-label'),   DATA.shopLabel);
  fillOptional($('gem-heading'),  DATA.gemHeading);
  fillOptional($('bridge'),       DATA.bridgeText);
  fillOptional($('gem-meaning-label'), DATA.meaningLabel);
  fillOptional($('gem-why-label'),     DATA.whyLabel);
  fillOptional($('others-heading'),    DATA.othersHeading);
  fillOptional($('shop-heading'), DATA.shopHeading);
  fillOptional($('shop-copy'),    DATA.shopCopy);
  fillOptional($('footer'),       DATA.footer);
  fillOptional($('disclaimer'),   DATA.disclaimer);
  $('restart').textContent = DATA.restartText || '重新選一次';
  linkOrDisabled($('shop-link'), DATA.shopUrl, DATA.shopBtnText || '逛逛全部水晶');

  const closing = $('closing-card');
  closing.replaceChildren();
  if(DATA.closingTitle){
    const h3 = document.createElement('h3');
    h3.textContent = DATA.closingTitle;
    closing.append(h3);
  }
  if(DATA.closingCopy){
    const p = document.createElement('p');
    p.className = 'long-copy';
    p.textContent = DATA.closingCopy;
    closing.append(p);
  }
  closing.hidden = !closing.childElementCount;

  if(DATA.couponCode){
    $('coupon').hidden = false;
    $('coupon-code').textContent = DATA.couponCode;
    $('coupon-desc').textContent = DATA.couponDesc || '';
  }
}

/* ── 選項按鈕 ── */
function renderOptions(){
  const box = $('options');
  box.replaceChildren();
  DATA.options.forEach((opt, i) => {
    const button = document.createElement('button');
    button.className = 'pick';
    button.type = 'button';
    const letter = document.createElement('span');
    const label  = document.createElement('span');
    letter.className = 'letter';
    letter.textContent = LETTERS[i];
    fill(label, opt.pick, '選項 ' + LETTERS[i] + ' 文案');
    button.append(letter, label);
    button.onclick = () => choose(i);
    box.append(button);
  });
}

/* ── 結果頁 ── */
function choose(i){
  const opt = DATA.options[i];
  if(!opt) return;

  $('intro').hidden = true;
  $('result').hidden = false;

  fill($('result-title'), opt.title, '結果標題');
  $('result-pick').textContent = '妳選了 ' + LETTERS[i] + '｜' + (opt.pick || '（選項文案待補）');

  // 解析段落
  const card = $('reading-card');
  card.replaceChildren();
  (opt.sections || []).forEach(sec => {
    if(sec.label){
      const label = document.createElement('div');
      label.className = 'label';
      label.textContent = sec.label;
      card.append(label);
    }
    if(sec.style === 'quote'){
      const quote = document.createElement('blockquote');
      fill(quote, sec.text, '引言');
      card.append(quote);
    }else{
      const body = document.createElement('p');
      body.className = 'long-copy' + (sec.style === 'boxed' ? ' boxed' : '');
      fill(body, sec.text, sec.label || '內文');
      card.append(body);
    }
  });

  // 水晶推薦
  const gem = opt.crystal || {};
  fill($('gem-name'),    gem.name,    '商品名稱');
  fill($('gem-stones'),  gem.stones,  '晶石組合');
  fill($('gem-meaning'), gem.meaning, '象徵涵義');
  fill($('gem-why'),     gem.why,     '推薦原因');
  imageOrPlaceholder($('gem-img-slot'), gem.img, gem.name ? gem.name + '水晶手鍊' : '', '商品圖待補');
  linkOrDisabled($('gem-link'), gem.url, gem.btnText || '看看適合妳的水晶');

  // 看更多
  const moreWrap = $('more-wrap');
  if(gem.moreUrl || gem.moreText){
    moreWrap.hidden = false;
    moreWrap.firstChild.textContent = DATA.moreIntro || '想看看其他適合妳的';
    linkOrDisabled($('more-link'), gem.moreUrl, gem.moreText || '看看更多水晶款式 →');
  }else{
    moreWrap.hidden = true;
  }

  // 其他選項摺疊
  const others = $('others');
  others.replaceChildren();
  DATA.options.forEach((other, n) => {
    if(n === i) return;
    const d = document.createElement('details');
    const summary = document.createElement('summary');
    const p = document.createElement('p');
    const button = document.createElement('button');
    summary.textContent = LETTERS[n] + '｜' + (other.pick || '（選項文案待補）');
    p.className = 'long-copy';
    p.textContent = other.title || '';
    button.className = 'secondary';
    button.textContent = '看完整解析';
    button.onclick = () => choose(n);
    d.append(summary, p, button);
    others.append(d);
  });

  window.scrollTo(0, 0);
  $('result-title').focus();
}

$('restart').onclick = () => {
  $('result').hidden = true;
  $('intro').hidden = false;
  window.scrollTo(0, 0);
  const first = $('options').children[0];
  if(first) first.focus();
};

/* ── 折扣碼複製 ── */
$('copy-code').onclick = async () => {
  const button = $('copy-code');
  const code = DATA.couponCode;
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      await navigator.clipboard.writeText(code);
    }else{
      const field = document.createElement('textarea');
      field.value = code;
      field.style.position = 'fixed';
      field.style.opacity = '0';
      document.body.append(field);
      field.select();
      const ok = document.execCommand('copy');
      field.remove();
      if(!ok) throw new Error('copy unavailable');
    }
    button.textContent = '已複製';
    $('copy-status').textContent = '折扣碼 ' + code + ' 已複製';
  }catch(e){
    button.textContent = code;
    $('copy-status').textContent = '請手動複製折扣碼 ' + code;
  }
};

renderStatic();
renderOptions();
</script>
