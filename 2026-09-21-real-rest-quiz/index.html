      A:{kicker:'A｜倒頭睡一覺',title:'妳最想要的，是不用再硬撐的睡眠',lead:'當妳終於有一小時屬於自己，第一個念頭是睡覺，可能連「放鬆」都需要先有力氣。',html:`
        <h3>妳可能很熟悉這種累</h3><p>早上鬧鐘響了，妳還沒下床，腦袋就開始跑今天的行程。洗衣服、回訊息、處理工作，到了晚上終於能坐下，妳又想著是不是該把明天的事先準備好。妳不是每一刻都在做事，卻很少有一段時間，能安心地對自己說「現在可以停了」。</p><p>所以就算週末睡得比平常晚，妳也可能沒有真正放鬆。醒來後先算剩下多少時間，一想到今天的安排還沒開始，就想趕快起身。這種時候，妳需要的也許不是再找一件能讓自己「恢復效率」的事，而是允許身體安靜地躺著，不把休息變成一場趕進度的比賽。</p>
        <h3>妳真正想放下的負擔</h3><p>選擇睡覺，不代表妳懶，也不代表睡一覺就能解決所有疲倦。它只是讓妳看見：現在最渴望的，可能是不用再對任何人交代、也不用一邊躺著一邊責怪自己的時間。尤其當妳習慣先照顧所有細節，身體的訊號常常得等到事情都做完才輪得到。</p><p>試著留意妳睡前最常多做的那一件事。是把明天的衣服準備好、再看一次訊息，還是把原本可以明天做的家事先完成？並非每件事都能延後，但若其中有一件可以留到明天，妳今晚就多拿回一點自己的時間。</p>
        <div class="quote">今晚先讓身體休息，不必證明妳把今天用得夠滿。</div><div class="exercise"><h3>今晚試一件小事</h3><p>選一件明天再處理也沒關係的小事，寫在紙上，然後把紙合起來。睡前給自己十分鐘不安排任何下一步。妳可以早一點上床，也可以只是在燈關掉後好好躺著。</p></div>`},
      B:{kicker:'B｜關掉手機，安靜發呆',title:'妳想暫停的，是腦袋裡不斷出現的下一件事',lead:'妳想要安靜，可能是因為平常連空下來的時間，都被訊息和待辦填滿了。',html:`
        <h3>坐著沒動，腦袋卻沒停過</h3><p>妳可能好不容易坐到沙發上，手卻自然地拿起手機：看看有沒有漏回的訊息、順便查明天的天氣，再提醒自己要買什麼。等螢幕終於關掉，腦中又冒出「我是不是忘了某件事」。別人看見妳在休息，只有妳知道，自己一直在接收、記住、安排、切換。</p><p>有時不是任何一則訊息特別麻煩，而是它們把一天切成很多小段。妳剛要讀完一頁書，想到還沒回覆朋友；剛想專心吃飯，又記起要確認週末的時間。妳想關掉手機，不一定是討厭誰，而是想讓這些入口暫時安靜，聽見自己現在究竟想做什麼。</p>
        <h3>「什麼都不做」也可以有位置</h3><p>發呆沒有成果，也不需要成果。妳不必在空白時間裡冥想、整理房間或規劃下一週，才算把這一小時用得值得。對一個腦袋很少停下來的人，暫時沒有任務，本身就是一種久違的鬆動。</p><p>如果一安靜下來就有點不自在，也不用逼自己立刻清空思緒。先讓訊息少一些、選擇少一些，坐著看一會兒窗外。待辦想到就記下一個詞，不急著馬上動手。妳練習的不是「完全不想」，而是發現自己有權決定什麼時候再開始處理。</p>
        <div class="quote">讓世界暫時等一下，妳不需要每一刻都在線上。</div><div class="exercise"><h3>今晚試一件小事</h3><p>把手機調成靜音，放到伸手拿不到的地方十分鐘。找個舒服的位置坐著，不開新的影片，也不要求自己放空成功。十分鐘過去後，再決定想不想回到訊息裡。</p></div>`},
      C:{kicker:'C｜找一個人說說最近的事',title:'妳需要的，可能是一段不用表現得很好的對話',lead:'有些疲倦是事情做完了，心裡卻還有很多話沒地方放。',html:`
        <h3>妳平常很會說「我沒事」</h3><p>朋友問最近怎麼樣，妳很快就能回答「還好啦」。妳不是故意藏起來，只是從哪一件事說起都覺得太小：工作上被打斷的一句話、家裡總是妳先想到的安排，或今天突然很想有人問妳累不累。每件事單獨看都不嚴重，放在心裡卻慢慢變得很重。</p><p>妳可能也會擔心，一開口對方會覺得妳在抱怨，或者聊到最後還要自己安慰對方。因此妳把事情講得很輕，講完笑一笑，就又把真正想說的那句收回去。當妳選了「找一個人說說最近的事」，妳想要的也許不是對方立刻給答案，而是能把一句話說完整，中途不必忙著替自己的感受辯解。</p>
        <h3>被聽見，不需要先把感受整理好</h3><p>妳不必想出一個完整故事，才值得找人聊。可以從「我最近有點累，但不知道怎麼講」開始，也可以坦白說「我現在不想解決問題，先聽我說一下就好」。願意陪妳的人，不一定每次都懂得完美回應；但妳可以慢慢找出，在誰面前比較能放下那句「沒事」。</p><p>當然，聊天也無法替妳消掉所有責任。它能做的，是讓妳不用把每一段情緒都獨自處理。如果最近找不到合適的人，先把想說的話寫下來、錄一段只給自己聽的語音，也可以是第一步。</p>
        <div class="quote">妳可以在還沒想清楚的時候，就先說出「我有點累」。</div><div class="exercise"><h3>今晚試一件小事</h3><p>想一個跟妳相處時不用太用力的人，傳一句：「我最近有點累，有空的時候可以聽我說十分鐘嗎？」不用在訊息裡先交代整件事，也不必為需要陪伴道歉。</p></div>`},
      D:{kicker:'D｜自己出門走走',title:'妳想找回的，是一段只照著自己步調走的時間',lead:'妳想出去走走，可能是想暫時離開那些總要先顧慮別人的位置。',html:`
        <h3>有時候，連休息都像在配合</h3><p>妳可能習慣出門前先問大家想吃什麼、去哪裡方便；待在家，也自然會留意誰需要幫忙。這些照顧不一定出於勉強，妳可能真心願意做。只是當很多個「先看別人」接在一起，妳會發現自己很少有機會走一條路，只因為今天想走那裡。</p><p>所以妳想要的不是什麼精心安排的旅行。也許只是下樓買杯飲料，經過一條有燈的街，看到喜歡的小店就慢下來，不想逛便回家。沒有人等妳決定晚餐，沒有人問下一站去哪裡；這段時間裡，妳可以只回答自己的感覺。</p>
        <h3>一個人走，不等於想遠離所有人</h3><p>需要獨處不代表妳不重視關係。當妳總在留意別人的節奏，一段自己決定方向的時間，能讓妳重新感覺到「我也在這裡」。妳可以不趕路、不拍照記錄、不把散步換算成步數；走到一半想坐下，也完全可以。</p><p>如果今天不方便外出，也能在日常裡留下很小的自主空間：自己選一首歌聽完、一個人去樓下繞一圈，或為下一頓飯選一樣真的想吃的東西。妳不需要等大家都有空，才有資格照顧自己的步調。</p>
        <div class="quote">有一段路，讓妳只需要想「我想往哪裡走」。</div><div class="exercise"><h3>今晚試一件小事</h3><p>找一條熟悉、走起來安心的短路線，留十分鐘給自己。出門前不用想這趟要得到什麼；回來時只問自己：剛剛哪一刻，我覺得比較能呼吸？</p></div>`}

    show(location.hash.slice(1).toUpperCase(),false);
  </script>
</body>
