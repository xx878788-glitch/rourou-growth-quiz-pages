<body><header><span class="brand">柔柔</span><span class="season">給自己的秋天小事</span></header><main>
<section id="choices" aria-labelledby="title"><div class="intro"><p class="eyebrow">憑直覺選一個</p><h1 id="title">這個秋天<br>妳最想先做哪件小事</h1><p>如果今天有一點時間留給自己<br>妳想怎麼過</p></div><figure class="scene-board"><img src="" alt="四個完整秋天情境：出去走走、吃頓喜歡的、約想念的人、好好睡一覺"><figcaption><span>A · 出去走走</span><span>B · 吃頓喜歡的</span><span>C · 約想念的人</span><span>D · 好好睡一覺</span></figcaption></figure><p class="pick-prompt">妳想先做哪一件</p><div class="grid">
<button class="choice" data-choice="A"><span class="label"><b>A</b><span>出去走走<small>去一段不用趕路的地方</small></span></span></button>
<button class="choice" data-choice="B"><span class="label"><b>B</b><span>吃頓喜歡的<small>今天，認真選自己想吃的</small></span></span></button>
<button class="choice" data-choice="C"><span class="label"><b>C</b><span>約想念的人<small>把「有空再約」變成見面</small></span></span></button>
<button class="choice" data-choice="D"><span class="label"><b>D</b><span>好好睡一覺<small>安心窩進喜歡的被窩</small></span></span></button>
</div><p class="gentle">選妳此刻想要的就好，不用想太久</p></section>

A:{label:'出去走走',title:'妳想要的，是一點新鮮的空氣',lead:'把自己從一成不變的日子裡，帶出去一下',image:'walk.webp',paragraphs:['最近的妳，可能沒有遇到什麼大事，只是每天醒來，待辦事項就已經排好了。工作、回訊息、處理生活，事情都有在做，心情卻像停在同一個地方。','妳選了出去走走，也許是在想：今天能不能有一小段路，不用趕著到哪裡，也不用順便完成什麼。讓眼睛看看別的風景，讓腦袋暫時離開那些反覆想的事。','妳不必立刻想清楚下一步。偶爾換一條回家的路，看看天色，停下來聞一聞路邊的香氣，日子就會多出一點自己的感覺。'],action:'趁天還亮，出門走十分鐘<br>挑一段不用趕路、也不用交代行程的路',closing:'有些心情，可以陪自己走一走再說'},
B:{label:'吃頓喜歡的',title:'妳想補回的，是被自己放在心上的感覺',lead:'今天的喜歡，也值得被認真對待',image:'meal.webp',paragraphs:['妳是不是很容易說「都可以」？別人想吃什麼，妳就跟著吃；忙起來隨便墊一點，自己的喜好常常排在最後。久了，連今天想吃什麼都要想一下。','選一頓喜歡的飯，可能是妳想把注意力放回自己身上。想吃熱的、想坐下來慢慢吃、想吃那家惦記很久的小店，這些小小的念頭，都值得有人回應。妳也可以成為那個人。','不用挑貴的，也不用等特別的日子。一碗麵、一份便當，或自己煮的家常菜，只要是妳有好好替自己選過的，就很有意義。'],action:'問自己一次「我今天真的想吃什麼」<br>留一頓飯，坐下來慢慢吃',closing:'照顧自己的喜歡，可以從下一餐開始'},
C:{label:'約想念的人',title:'妳想要的，是有人一起過日常',lead:'不用把話整理好，才去見想念的人',image:'friend.webp',paragraphs:['妳可能一直有某個人想見，卻總把邀約留在「等比較有空」。想著對方很忙，自己也有一堆事，於是那句有空再約，說著說著就過了好幾個月。','妳選了見面，也許最近有些話，想在熟悉的人面前慢慢說。可以是煩惱，也可以只是分享最近吃到的東西、吐槽生活裡的小事。有人接得住，普通的一天也會舒服一點。','不用等狀態最好，也不用安排一整天。一起吃頓飯、喝杯茶，或散步半小時就很好。想念一個人，可以先把那句話傳出去。'],action:'傳訊息給一個妳想見的人<br>「最近想見妳，下週找一天吃個飯好不好」',closing:'這次，把「有空再約」變成一個真的日子'},
D:{label:'好好睡一覺',title:'妳想留給自己的，是安心停下來的時間',lead:'今天不用再把自己撐到最後一刻',image:'rest.webp',paragraphs:['最近的妳，可能很習慣把事情做完才休息。明明已經累了，還是想再回一則訊息、再做一點，躺下以後，腦袋又開始盤點明天。','選了好好睡一覺，也許妳很想要一段沒有人催、也不用立刻回應的時間。暫時把責任放下，讓自己不用一直保持能處理所有事的樣子。','休息可以先從一個小細節開始。換上舒服的睡衣，把床整理好，讓手機離枕頭遠一點。還沒完成的事，留一張紙記下來，今晚先讓自己安穩躺著。'],action:'今晚替自己留一段安靜的睡前時間<br>把待辦寫下來，讓腦袋不用一直替妳記著',closing:'妳的休息，也值得排進今天的行程'}

A:{notice:'妳可能也會發現，假日排得很滿，回來卻沒有比較輕鬆。當散步也變成打卡、拍照、一定要走到哪裡，又多了一份要完成的事。這一次，可以讓行程只剩「出去一下」，走到想回家就回家。',words:'柔柔想跟妳說，今天散步沒有想通什麼，也算一個很好的下午。妳只是出去看看天、吹吹風，就已經有好好陪到自己了。'},
B:{notice:'有時候，妳買東西給別人很乾脆，輪到自己就開始算值不值得；有人問起妳的需要，妳又怕太麻煩。可以先練習把一個小喜好說清楚：「我今天想吃這個。」不用附上一大串理由。',words:'柔柔想跟妳說，妳也可以是那個被惦記的人。記住自己喜歡的口味、替自己盛一碗飯，都是很實在的照顧。下一餐，先聽聽自己的答案吧。'},
C:{notice:'妳想見的人，也許就是那個見面不用找話題，安靜坐著也不尷尬的人。邀約可以很小：下班一起吃個飯，或者週末喝一杯。不必準備什麼值得分享的大事，普通的生活就可以拿出來聊。',words:'柔柔想跟妳說，妳不必每次都當那個聽大家說話的人。這次也留一點時間給自己，把最近的心情說一說，讓想念妳的人有機會靠近。'},
D:{notice:'妳可能也捨不得結束一天：白天都在忙別人的事，晚上終於有自己的時間，滑著手機就越來越晚。可以試著提早留十分鐘給自己，做一點喜歡的事，讓睡前少一點「今天還沒輪到我」的遺憾。',words:'柔柔想跟妳說，做到這裡已經可以了。把房間的燈調暗，讓今晚安靜一點。明天的事情明天再接，今天的妳先被好好照顧。'}
};
const choices=document.getElementById('choices'),result=document.getElementById('result');let lastChoice;
function selectChoice(key){if(!Object.hasOwn(results,key))throw new Error('請選 A、B、C 或 D');const r=results[key];lastChoice=key;document.getElementById('picked').textContent='妳選了 '+key+' · '+r.label;document.getElementById('result-title').textContent=r.title;document.getElementById('lead').textContent=r.lead;document.getElementById('result-image').src=artwork;document.getElementById('result-art').dataset.scene=key;document.getElementById('result-image').alt=r.label;const story=document.getElementById('story');const headings=['最近的妳，可能有這些感覺','妳想補回的那一點照顧','可以慢慢調整的小細節','柔柔想跟妳說'];const texts=[r.paragraphs[0],r.paragraphs[1],r.paragraphs[2]+' '+extra[key].notice,extra[key].words];story.replaceChildren(...texts.map((t,i)=>{const a=document.createElement('article');const h=document.createElement('h2');h.textContent=headings[i];const p=document.createElement('p');p.textContent=t;a.append(h,p);if(i===1){const d=document.createElement('div');d.className='tiny-art';d.dataset.scene=key;d.setAttribute('aria-hidden','true');const img=document.createElement('img');img.src=artwork;img.alt='';d.append(img);a.append(d)}return a}));document.getElementById('action').innerHTML=r.action;document.getElementById('closing').textContent=r.closing;choices.hidden=true;result.hidden=false;window.scrollTo({top:0,behavior:'instant'});document.getElementById('result-title').focus({preventScroll:true});return {choice:key,title:r.title}}
document.querySelectorAll('[data-choice]').forEach(b=>b.addEventListener('click',()=>selectChoice(b.dataset.choice)));
document.getElementById('back').addEventListener('click',()=>{result.hidden=true;choices.hidden=false;document.querySelector('[data-choice="'+lastChoice+'"]').focus();window.scrollTo({top:0,behavior:'instant'})});
if(document.modelContext?.registerTool){try{Promise.resolve(document.modelContext.registerTool({name:'select_autumn_care',description:'選擇秋天小事並顯示對應完整解析',inputSchema:{type:'object',properties:{choice:{type:'string',enum:['A','B','C','D']}},required:['choice'],additionalProperties:false},annotations:{readOnlyHint:false},execute:input=>selectChoice(input?.choice)})).catch(()=>{})}catch{}}
</script></body></html>
